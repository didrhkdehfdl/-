let pdfJsLoadPromise = null;
const PDFJS_BASE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
// Some PDFs (especially ones from Korean government/business software) use
// non-embedded CJK fonts rather than embedding the glyphs directly. Without
// pointing pdf.js at the matching CMap + standard-font data, it silently
// fails to draw those characters — everything else on the page (lines,
// borders, embedded-font text) renders fine, but that text just vanishes.
// jsdelivr serves the pdfjs-dist npm package's own cmaps/ and
// standard_fonts/ folders directly, matching this exact pdf.js version.
const PDFJS_CMAP_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const PDFJS_STANDARD_FONTS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';
function pdfjsDocOptions(extra){
  return Object.assign({ cMapUrl: PDFJS_CMAP_URL, cMapPacked: true, standardFontDataUrl: PDFJS_STANDARD_FONTS_URL }, extra||{});
}
function loadPdfJsLibrary(){
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = (async () => {
    if(!window.pdfjsLib){
      await loadScript(PDFJS_BASE_URL + 'pdf.min.js');
    }
    // Some sandboxed/CSP'd environments block a worker script loading
    // directly from a cross-origin URL even when a plain <script> tag
    // from that same origin is allowed (worker-src can be stricter than
    // script-src). Fetching the worker code ourselves and handing pdf.js
    // a blob: URL for it sidesteps that, since blob: is same-origin.
    try{
      const workerCode = await fetch(PDFJS_BASE_URL + 'pdf.worker.min.js').then(r=>r.text());
      const blob = new Blob([workerCode], { type:'application/javascript' });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    }catch(e){
      // Fall back to the direct URL — pdf.js has its own fake-worker
      // fallback if this also doesn't work out.
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE_URL + 'pdf.worker.min.js';
    }
  })();
  return pdfJsLoadPromise;
}

// Renders every page of every given PDF (as raw bytes) into <canvas>
// elements inside the in-app preview overlay, so the person can actually
// see the contract(s) before printing — instead of relying on a new tab
// or embedded viewer, which can render blank in some browser/sandbox
// setups. `downloadName`/`downloadBlob` back the toolbar's 다운로드 link,
// and `label` is the small caption shown next to the toolbar buttons.
async function showPdfPreviewOverlay(byteArrays, { label, downloadName, downloadBlob } = {}){
  const overlay = document.getElementById('contractPreviewOverlay');
  const sheet = document.getElementById('contractPreviewSheet');
  const labelEl = document.getElementById('contractPreviewLabel');
  sheet.innerHTML = `<div class="pdf-preview-loading">미리보기를 준비하는 중…</div>`;
  labelEl.textContent = label || '';
  overlay.classList.add('show');

  const downloadLink = document.getElementById('contractPreviewDownloadBtn');
  if(downloadBlob){
    downloadLink.href = URL.createObjectURL(downloadBlob);
    downloadLink.setAttribute('download', downloadName || 'document.pdf');
    downloadLink.style.display = '';
  } else {
    downloadLink.style.display = 'none';
  }

  try{
    await withTimeout(loadPdfJsLibrary(), 15000);
    if(!window.pdfjsLib) throw new Error('pdf.js failed to load');
    sheet.innerHTML = '';
    for(const bytes of byteArrays){
      const pdf = await withTimeout(window.pdfjsLib.getDocument(pdfjsDocOptions({ data: bytes })).promise, 20000);
      if(!pdf) throw new Error('PDF loading timed out');
      for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
        const page = await pdf.getPage(pageNum);
        const baseViewport = page.getViewport({ scale:1 });
        const scale = Math.min(1500 / baseViewport.width, 2); // fit the overlay's ~1500px width, cap for very small pages
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const wrap = document.createElement('div');
        wrap.className = 'pdf-preview-page';
        wrap.appendChild(canvas);
        sheet.appendChild(wrap);
        await withTimeout(page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise, 15000);
      }
    }
    if(sheet.children.length===0){
      sheet.innerHTML = `<div class="pdf-preview-loading">표시할 페이지가 없습니다.</div>`;
    }
  }catch(err){
    console.error(err);
    sheet.innerHTML = `<div class="pdf-preview-loading">미리보기를 불러오지 못했습니다. 다운로드 버튼으로 파일을 받아 확인해주세요.</div>`;
  }
}

function base64ToBytes(base64){
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Merges every selected contract (in the order currently shown — i.e. by
// contract date) into a single combined PDF using pdf-lib, then opens it in
// a new tab so the person can print all of them together as one job,
// instead of each PDF's viewer printing separately.
async function printSelectedContracts(){
  const btn = document.getElementById('contractPrintSelectedBtn');
  const original = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '병합 중…'; btn.disabled = true; }
  try{
    await loadPdfLibLibrary();
    const orderedItems = sortedContracts().filter(it => contractsState.selected.has(it.id));
    if(orderedItems.length===0) return;

    const { PDFDocument } = window.PDFLib;
    const merged = await PDFDocument.create();
    for(const item of orderedItems){
      const base64 = await loadContractFileData(item.id);
      if(!base64) continue;
      const donorBytes = base64ToBytes(base64);
      const donor = await PDFDocument.load(donorBytes, { ignoreEncryption:true });
      const pages = await merged.copyPages(donor, donor.getPageIndices());
      pages.forEach(p => merged.addPage(p));
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type:'application/pdf' });
    showPdfPreviewOverlay([mergedBytes], {
      label: `선택한 계약서 ${orderedItems.length}건이 날짜순으로 합쳐졌습니다. 확인 후 인쇄 버튼을 눌러주세요.`,
      downloadName: `계약서_병합_${isoDate(new Date())}.pdf`,
      downloadBlob: blob,
    });
  }catch(err){
    console.error(err);
    alert('PDF를 합치는 중 오류가 발생했습니다. 손상되었거나 암호로 보호된 파일이 포함되어 있지 않은지 확인해주세요.');
  }finally{
    if(btn){ btn.textContent = original; btn.disabled = false; }
  }
}

let tesseractLoadPromise = null;
function loadTesseractLibrary(){
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = (async () => {
    if(!window.Tesseract){
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
  })();
  return tesseractLoadPromise;
}

// Renders page 1 of a PDF (given as raw bytes) to a canvas at a resolution
// generous enough for OCR, reusing the same pdf.js setup as the contract
// preview feature.
async function renderPdfFirstPageToCanvas(bytes){
  await loadPdfJsLibrary();
  const pdf = await withTimeout(window.pdfjsLib.getDocument(pdfjsDocOptions({ data: bytes })).promise, 20000);
  if(!pdf) throw new Error('PDF loading timed out');
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 3.5 }); // higher-res than the print preview, for sharper digits/characters going into OCR
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await withTimeout(page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise, 15000);
  return canvas;
}

// Loads an uploaded image into a canvas, upscaling small/low-res images so
// there's more pixel detail for OCR to work with (helps distinguish
// similar-looking digits like 1/2/4/5 in scanned forms).
function loadImageToCanvas(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const targetWidth = 2200; // upscale small photos/scans; downscale is skipped (canvas just uses natural size if already larger)
      const scale = img.naturalWidth < targetWidth ? targetWidth / img.naturalWidth : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Converts a canvas to grayscale + a hard black/white threshold. Scanned
// certificates are normally solid black text on a white background, so
// binarizing removes scan noise/gray halos around characters that
// otherwise make similar digits (1/2/4/5, 0/6/8) harder for OCR to tell apart.
function preprocessCanvasForOcr(canvas){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  const threshold = 150;
  for(let i=0; i<d.length; i+=4){
    const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const v = gray > threshold ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

// Runs OCR on one 사용전점검 확인증 upload (PDF or image) and fills in the
// item's extracted 대표자 성명 / 점검년월일 fields. Always leaves the item
// in a usable state — on any failure it just marks the fields unrecognized
// so the person can type them in by hand instead.
async function runOcrForItem(item){
  item.ocrStatus = 'running';
  renderInspectionMain();
  try{
    const base64 = await loadInspectionFileData(item.id);
    if(!base64) throw new Error('file data missing');
    await loadTesseractLibrary();
    let canvas;
    if(item.mime === 'application/pdf'){
      canvas = await renderPdfFirstPageToCanvas(base64ToBytes(base64));
    } else {
      canvas = await loadImageToCanvas(`data:${item.mime};base64,${base64}`);
    }
    preprocessCanvasForOcr(canvas);
    const worker = await withTimeout(Tesseract.createWorker('kor'), 20000);
    if(!worker) throw new Error('OCR worker failed to start');
    try{
      // PSM 6 ("assume a single uniform block of text") tends to read
      // structured forms/certificates more reliably than the fully
      // automatic default layout analysis.
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      const result = await withTimeout(worker.recognize(canvas), 45000);
      if(!result) throw new Error('OCR timed out');
      const text = result.data.text || '';
      item.ocrText = text;
      item.extractedName = parseInspectionNameFromText(text, item.fileName);
      item.extractedDate = parseInspectionDateFromText(text);
      item.ocrStatus = (item.extractedName || item.extractedDate) ? 'done' : 'unrecognized';
    } finally {
      try{ await worker.terminate(); }catch(e){}
    }
  }catch(err){
    console.error(err);
    item.ocrStatus = 'error';
  }
  await saveInspectionIndex(inspectionState.items);
  renderInspectionMain();
}

// Re-runs OCR for every uploaded 사용전점검 확인증 one at a time (not in
// parallel, to keep the client-side OCR engine's CPU/memory use reasonable
// — mirrors how a fresh batch upload is processed).
async function reocrAllInspectionItems(){
  const btn = document.getElementById('inspectionReocrAllBtn');
  const items = [...inspectionState.items];
  for(let i=0; i<items.length; i++){
    if(btn) btn.textContent = `🔄 다시 인식 중… (${i+1}/${items.length})`;
    await runOcrForItem(items[i]);
  }
  if(btn) btn.textContent = '🔄 전체 다시 인식';
}

async function ensureInspectionLoaded(){
  if(inspectionState.loaded || inspectionState.loading) return;
  inspectionState.loading = true;
  inspectionState.items = await loadInspectionIndex();
  inspectionState.loading = false;
  inspectionState.loaded = true;
}

async function renderInspectionMain(){

    main.innerHTML = `<div class="no-case"><div class="big">불러오는 중…</div></div>`;

    if(state.activeTab !== 'inspection') return;
  }
  const items = inspectionState.items;
  const matches = items.map(it => ({ item: it, m: computeInspectionMatch(it) }));
  const matchCount = matches.filter(x => x.m.overall).length;
  const mismatchCount = items.length - matchCount;

  main.innerHTML = `
    <h2 class="section-title">사용전점검(검사) 확인증 관리</h2>
    <p style="font-size:13px; color:var(--muted); line-height:1.7; margin:0 0 14px;">
      사용전점검 확인증 PDF/이미지를 업로드하면, 파일 이름에 들어있는 이름이 문서 안에 실제로 등장하는지 확인해서
      (등장하면 일치로 처리) 자동으로 판정합니다. <b>점검년월일</b>은 일치 판정과 상관없이 참고용으로 항상 자동 인식해서 채워둡니다.
      자동 인식이 틀렸다면 표에서 직접 값을 고칠 수 있고, 일치 여부는 바로 다시 계산됩니다.
    </p>
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px;">
      <input type="file" id="inspectionUploadInput" accept="application/pdf,image/*" multiple style="font-size:13px; color:var(--muted);">

async function handleInspectionUpload(e){
  const files = [...(e.target.files||[])];
  if(files.length===0) return;
  const MAX_BYTES = 3.5*1024*1024; // see contracts upload for why (base64 inflates ~33%, storage cap is 5MB)
  const skipped = [];
  const newItems = [];
  for(const file of files){
    if(file.size > MAX_BYTES){
      skipped.push(`${file.name} (5MB 저장 한도 초과)`);
      continue;
    }
    if(file.type !== 'application/pdf' && !file.type.startsWith('image/')){
      skipped.push(`${file.name} (PDF 또는 이미지 파일만 지원)`);
      continue;
    }
    try{
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const id = rid();
      const saveResult = await saveInspectionFileData(id, base64);
      if(!saveResult.ok){ skipped.push(`${file.name} (저장 실패: ${saveResult.reason})`); continue; }
      const item = { id, fileName: file.name, size: file.size, mime: file.type, extractedName:'', extractedDate:'', ocrStatus:'pending' };
      inspectionState.items.push(item);
      newItems.push(item);
    }catch(err){
      console.error(err);
      skipped.push(file.name);
    }
  }
  await saveInspectionIndex(inspectionState.items);
  renderInspectionMain();
  if(skipped.length){
    alert(`다음 파일은 저장하지 못했습니다:\n${skipped.join('\n')}`);
  }
  // Run OCR one file at a time (not in parallel) to keep memory/CPU use
  // reasonable for a client-side WASM OCR engine.
  for(const item of newItems){
    await runOcrForItem(item);
  }
}

// Runs OCR on a 사업자등록증 upload and fills in the parsed business-info
// fields. Mirrors runOcrForItem's structure (PDF vs image handling, timeout
// safety) — always leaves the item usable even if OCR fails, since every
// field stays manually editable regardless.
async function runBizRegOcrForItem(item){
  item.ocrStatus = 'running';
  renderAgentDocsMain();
  try{
    const base64 = await loadAgentDocFileData(item.id);
    if(!base64) throw new Error('file data missing');
    await loadTesseractLibrary();
    let canvas;
    if(item.mime === 'application/pdf'){
      canvas = await renderPdfFirstPageToCanvas(base64ToBytes(base64));
    } else {
      canvas = await loadImageToCanvas(`data:${item.mime};base64,${base64}`);
    }
    preprocessCanvasForOcr(canvas);
    const worker = await withTimeout(Tesseract.createWorker('kor'), 20000);
    if(!worker) throw new Error('OCR worker failed to start');
    try{
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      const result = await withTimeout(worker.recognize(canvas), 45000);
      if(!result) throw new Error('OCR timed out');
      const text = result.data.text || '';
      item.ocrText = text;
      const parsed = parseBizRegFromText(text);
      item.isCorporate = parsed.isCorporate;
      item.bizName = parsed.bizName;
      item.ownerName = parsed.ownerName;
      item.bizNumber = parsed.bizNumber;
      item.bizType = parsed.bizType;
      item.bizItem = parsed.bizItem;
      item.email = parsed.email;
      item.ocrStatus = 'done';
    } finally {
      try{ await worker.terminate(); }catch(e){}
    }
  }catch(err){
    console.error(err);
    item.ocrStatus = 'error';
  }
  await saveAgentDocsIndex(agentDocsState.items);
  renderAgentDocsMain();
}

      if(!item) return;
      const field = el.dataset.field;
      item[field] = field==='isCorporate' ? (el.value===''?null:el.value==='true') : el.value.trim();
      await saveAgentDocsIndex(agentDocsState.items);
    });
  });
  main.querySelectorAll('.agentdoc-reocr-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(item) runBizRegOcrForItem(item);
    });
  });
  main.querySelectorAll('.agentdoc-view-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const original = btn.textContent;
      btn.textContent = '여는 중…';
      const base64 = await loadAgentDocFileData(item.id);
      btn.textContent = original;
      if(!base64){ alert('파일을 불러오지 못했습니다.'); return; }
      const blob = new Blob([base64ToBytes(base64)], { type:item.mime });
      if(item.mime === 'application/pdf'){
        showPdfPreviewOverlay([base64ToBytes(base64)], { label: item.fileName, downloadName: item.fileName, downloadBlob: blob });
      } else {
        showImagePreviewOverlay(`data:${item.mime};base64,${base64}`, { label: item.fileName, downloadName: item.fileName, downloadBlob: blob });
      }
    });
  });
  main.querySelectorAll('.agentdoc-del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('이 서류를 삭제할까요? 되돌릴 수 없습니다.')) return;
      const id = btn.dataset.id;
      agentDocsState.items = agentDocsState.items.filter(it=>it.id!==id);
      await saveAgentDocsIndex(agentDocsState.items);
      await deleteAgentDocFileData(id);
      renderAgentDocsMain();
    });
  });
}

      if(!tr) return;
      const row = importState.rows.find(r=>r.id===tr.dataset.rowId);
      if(!row) return;
      const field = inp.dataset.perf;
      row[field] = isNumeric ? (parseFloat(String(inp.value).replace(/,/g,''))||0) : inp.value;

// 사업 이윤정산 자재비 섹션의 인버터 구매가/판매가.
const PROFIT_INVERTER_PRICES = {
  'T3R7K': { buy:283000, sell:320000 },
};

const PERF_MODULE_MODELS = [
  'Q.PEAK DUO ML-G11S.2 KC1 500',
  'HiS-S500NR-ESB',
  'HIC-T640OJ',
  'HiS-T500OH-ET',
];
// 사업 이윤정산 자재비 섹션의 모듈별 구매가/판매가.
// 사용자가 준 단가(275/250/210/230, 275/300/260/280)는 W당 단가이며,
// 실제 금액 = 단가 × 모듈 옆 숫자(와트수: 한화/현대 500 또는 640).
const PROFIT_MODULE_PRICES = {
  'Q.PEAK DUO ML-G11S.2 KC1 500': { buy:275*500, sell:275*500 }, // 한화 500
  'HiS-S500NR-ESB': { buy:250*500, sell:300*500 },               // 현대 500 (2등급)
  'HIC-T640OJ': { buy:210*640, sell:260*640 },                    // 현대 640
  'HiS-T500OH-ET': { buy:230*500, sell:280*500 },                 // 현대 500 (무등급)
};
// Base (슬라브형) 입금가 for each module, matching the 영업비 정산 쪽 단가:
// 한화500, 현대500(2등급), 현대640, 현대500(무등급).
const PERF_MODULE_BASE_PRICE = {
  'Q.PEAK DUO ML-G11S.2 KC1 500': 2830000, // 한화 500
  'HiS-S500NR-ESB': 2900000,               // 현대 500, 2등급
  'HIC-T640OJ': 2900000,                    // 현대 640
  'HiS-T500OH-ET': 2830000,                 // 현대 500, 무등급
};
// 부착형 시공은 슬라브형보다 10만원 낮은 단가를 쓴다 (기존 영업비 정산 모듈 단가와 동일한 패턴).
function computePerfCompanyPrice(row){
  const base = PERF_MODULE_BASE_PRICE[row.moduleModel];
  if(base === undefined) return null;
  const isAttached = /부착형/.test(row.structureType||'');
  return isAttached ? base - 100000 : base;
}
// Maps each 실적리스트 module name to its matching index in MODULE_NOTE_OPTIONS
// (the same 8-option 입금가 list), so the 비고's 입금가 line can show the
// correct readable label, not just the raw computed number.
const PERF_MODULE_TO_NOTE_INDEX = {
  'Q.PEAK DUO ML-G11S.2 KC1 500': { attached:7, slab:6 }, // 한화 500
  'HiS-S500NR-ESB': { attached:3, slab:2 },                // 현대 500, 2등급
  'HIC-T640OJ': { attached:5, slab:4 },                    // 현대 640
  'HiS-T500OH-ET': { attached:0, slab:1 },                 // 현대 500, 무등급
};
function findPerfModuleNoteIndex(row){
  const entry = PERF_MODULE_TO_NOTE_INDEX[row.moduleModel];
  if(!entry) return -1;
  const isAttached = /부착형/.test(row.structureType||'');
  return isAttached ? entry.attached : entry.slab;
}

function perfCellHtml(r, field, type){
  const v = r[field];
  if(type === 'module'){
    return `<select data-perf="${field}" style="width:100%;">
      <option value="">선택 안 함</option>
      ${PERF_MODULE_MODELS.map(label=>`<option value="${escapeHtml(label)}" ${v===label?'selected':''}>${escapeHtml(label)}</option>`).join('')}
    </select>`;
  }
  if(type === 'team'){
    return `<select data-perf="${field}" style="width:100%;">
      <option value="">선택 안 함</option>
      <option value="임인철" ${v==='임인철'?'selected':''}>임인철</option>
      <option value="김성주" ${v==='김성주'?'selected':''}>김성주</option>
    </select>`;
  }
  if(type === 'number'){
    const display = v ? Number(v).toLocaleString('ko-KR') : '';
    return `<input type="text" inputmode="numeric" data-perf="${field}" data-numeric="true" value="${display}" class="num" style="width:100%;">`;
  }
  if(type === 'nativedate'){
    return `<input type="date" data-perf="${field}" value="${escapeHtml(v)}" style="width:100%;">`;
  }
  if(type === 'date'){
    return `<input type="text" data-perf="${field}" value="${escapeHtml(v)}" placeholder="2026-07-21" style="width:100%;">`;
  }
  if(type === 'multidate'){
    const lineCount = v ? String(v).split('\n').length : 1;
    return `<textarea data-perf="${field}" placeholder="2026-07-21" rows="${Math.max(2, Math.min(lineCount, 4))}" style="width:100%; resize:vertical; font-size:12px; line-height:1.35; white-space:pre;">${escapeHtml(v)}</textarea>`;
  }
  if(type === 'multitext'){
    const lineCount = v ? String(v).split('\n').length : 1;
    return `<textarea data-perf="${field}" rows="${Math.max(3, Math.min(lineCount+1, 5))}" style="width:100%; resize:vertical; font-size:12px; line-height:1.5; padding:6px 7px;">${escapeHtml(v)}</textarea>`;
  }
  return `<input type="text" data-perf="${field}" value="${escapeHtml(v)}" style="width:100%;">`;
}

function wirePerfRowEvents(){
  const tbody = document.getElementById('perfRowBody');
  if(!tbody) return;

  tbody.querySelectorAll('.perf-row-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.dataset.id;
      if(cb.checked) importState.selectedManual.add(id);
      else importState.selectedManual.delete(id);
      renderManualEntry();
    });
  });
  const selectAll = document.getElementById('perfSelectAll');
  if(selectAll){
    selectAll.checked = importState.manualRows.length>0 && importState.manualRows.every(r=>importState.selectedManual.has(r.id));
    selectAll.addEventListener('change', ()=>{
      if(selectAll.checked) importState.manualRows.forEach(r=>importState.selectedManual.add(r.id));
      else importState.selectedManual.clear();
      renderManualEntry();
    });
  }
  const bulkBtn = document.getElementById('perfBulkSalesBtn');
  if(bulkBtn){
    bulkBtn.addEventListener('click', ()=>{
      const selectedRows = importState.manualRows.filter(r=>importState.selectedManual.has(r.id));
      createSalesCaseFromRows(selectedRows);
      importState.selectedManual = new Set();
    });
  }

  tbody.querySelectorAll('[data-perf]').forEach(inp=>{
    const isNumeric = inp.dataset.numeric === 'true';
    const handler = () => {
      const tr = inp.closest('tr[data-id]');
      const id = tr.dataset.id;
      const row = importState.manualRows.find(r=>r.id===id);
      if(!row) return;
      const field = inp.dataset.perf;
      row[field] = isNumeric ? (parseFloat(String(inp.value).replace(/,/g,''))||0) : inp.value;
      if(field === 'moduleModel' || field === 'structureType'){
        const price = computePerfCompanyPrice(row);
        if(price !== null){
          row.companyPrice = price;
          const priceInp = tr.querySelector('[data-perf="companyPrice"]');
          if(priceInp) priceInp.value = price.toLocaleString('ko-KR');
        }
      }
      debouncedSavePerfRows();
    };
    inp.addEventListener('input', handler);
    inp.addEventListener('change', handler);
    if(isNumeric){
      inp.addEventListener('blur', ()=>{
        const tr = inp.closest('tr[data-id]');
        const row = importState.manualRows.find(r=>r.id===tr.dataset.id);
        inp.value = row && row[inp.dataset.perf] ? Number(row[inp.dataset.perf]).toLocaleString('ko-KR') : '';
      });
    }
  });

  tbody.querySelectorAll('.perf-del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.id;
      importState.manualRows = importState.manualRows.filter(r=>r.id!==id);
      debouncedSavePerfRows();
      renderManualEntry();
    });
  });

  tbody.querySelectorAll('.perf-make-sales').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.id;
      const row = importState.manualRows.find(r=>r.id===id);
      createCaseFromImportRow(row, 'sales');
    });
  });
  tbody.querySelectorAll('.perf-make-profit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.id;
      const row = importState.manualRows.find(r=>r.id===id);
      createCaseFromImportRow(row, 'profit');
    });
  });
}

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  importState = { ...importState, fileName:file.name, sheetNames:[], sheetName:'', rows:[], search:'', loading:true, error:'', selected:new Set() };
  renderImportMain();
  try{
    await loadXlsxLib();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    importState.workbook = wb;
    importState.sheetNames = wb.SheetNames;
    importState.loading = false;
    const preferred = wb.SheetNames.find(n=>/^\d{4}$/.test(n)) || wb.SheetNames[0];
    parseImportSheet(preferred);
  }catch(err){
    console.error(err);
    importState.loading = false;
    importState.error = '파일을 읽지 못했습니다. 인터넷 연결을 확인하거나 파일 형식을 확인해주세요.';
    renderImportMain();
  }
}

function parseImportSheet(sheetName){
  try{
    const wb = importState.workbook;
    const sheet = wb.Sheets[sheetName];
    const grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false, dateNF:'yyyy-mm-dd' });
    // Find the header row: the row with the most recognizable header labels.
    let headerRowIdx = -1, bestScore = 0;
    for(let i=0;i<Math.min(grid.length, 15);i++){
      const row = grid[i];
      const prevRow = i>0 ? grid[i-1] : [];
      let score = 0;
      const maxLen = Math.max(row.length, prevRow.length);
      for(let c=0;c<maxLen;c++){
        // Score using the same detail-row-first, group-row-fallback logic
        // that the actual column mapping below uses, so header-row
        // detection can't disagree with it (some sheets split labels
        // across the two header rows differently than others).
        const norm = normalizeHeader(row[c]) || normalizeHeader(prevRow[c]);
        if(norm && IMPORT_HEADER_MAP.some(([key])=>norm.includes(key))) score++;
      }
      if(score > bestScore){ bestScore = score; headerRowIdx = i; }
    }
    if(headerRowIdx === -1){
      importState.error = '헤더 행을 찾지 못했습니다. 다른 시트를 선택해보세요.';
      importState.rows = [];
      importState.sheetName = sheetName;
      renderImportMain();
      return;
    }
    const headerRow = grid[headerRowIdx];
    const groupRow = headerRowIdx > 0 ? grid[headerRowIdx-1] : [];
    const colMap = {}; // field -> column index
    const maxCols = Math.max(headerRow.length, groupRow.length);
    for(let colIdx=0; colIdx<maxCols; colIdx++){
      // Prefer the detail row's own label; fall back to the group-header
      // row above it for columns where the detail row is blank (this file
      // splits headers across two rows, e.g. '시공일자' only appears in the
      // group row while '고객명' only appears in the detail row).
      const combined = normalizeHeader(headerRow[colIdx]) || normalizeHeader(groupRow[colIdx]);
      if(!combined) continue;
      for(const [key, field] of IMPORT_HEADER_MAP){
        if(combined.includes(key) && !(field in colMap)){
          colMap[field] = colIdx;
          break;
        }
      }
    }

    const rows = [];
    for(let i=headerRowIdx+1; i<grid.length; i++){
      const row = grid[i];
      if(!row || row.every(v=>v==='' || v==null)) continue;
      const get = (field) => (field in colMap) ? row[colMap[field]] : '';
      const customer = get('customer');
      if(!customer) continue; // skip rows without a customer name (section spacers, totals, etc.)
      rows.push({
        id: rid(),
        date: excelDateToIso(get('date')),
        contractDate: excelDateToIso(get('contractDate')),
        corp: String(get('corp')||''),
        customer: String(customer).replace(/\s*\n\s*/g, ' ').trim(),
        phone: String(get('phone')||''),
        rrn: String(get('rrn')||''),
        address: String(get('address')||''),
        capacity: get('capacity') || '',
        totalAmount: parseExcelNumber(get('totalAmount')),
        moduleModel: String(get('moduleModel')||''),
        moduleQty: parseExcelNumber(get('moduleQty')),
        inverterModel: String(get('inverterModel')||''),
        inverterQty: parseExcelNumber(get('inverterQty')),
        team: String(get('team')||''),
        structureType: String(get('structureType')||''),
        agent: String(get('agent')||''),
        depositDate: excelDateToIso(get('depositDate')),
        deposit: parseExcelNumber(get('deposit')),
        receivable: parseExcelNumber(get('receivable')),
        certDate: excelDateToIso(get('certDate')),
        taxTarget: String(get('taxTarget')||''),
        taxDate: excelDateToIso(get('taxDate')),
        supplyAmount: parseExcelNumber(get('supplyAmount')),
        companyPrice: parseExcelNumber(get('companyPrice')),
        extra: parseExcelNumber(get('extra')),
        extraNote: redactRRN(String(get('extraNote')||'')),
        salesCost: parseExcelNumber(get('salesCost')),
        finalSalesCost: parseExcelNumber(get('finalSalesCost')),
        payDate: excelDateToIso(get('payDate')),
        note: redactRRN(String(get('note')||'')),
      });
    }
    importState.sheetName = sheetName;
    importState.rows = rows;
    importState.error = rows.length ? '' : '이 시트에서 고객 데이터를 찾지 못했습니다.';
    if(rows.length){
      saveFileToStorage(IMPORT_DATA_KEY, JSON.stringify({
        fileName: importState.fileName, sheetNames: importState.sheetNames,
        sheetName: importState.sheetName, rows: importState.rows
      }));
    }
    renderImportMain();
  }catch(err){
    console.error(err);
    importState.error = '시트를 읽는 중 오류가 발생했습니다.';
    renderImportMain();
  }
}

function buildSalesRecordFromRow(row, defaultCorp){
  const rec = newRecord(row.corp || defaultCorp);
  Object.assign(rec, {
    date: row.date, contractDate: row.contractDate, customer: row.customer, address: row.address,
    team: row.team, structureType: row.structureType,
    capacity: (() => {
      const c = String(row.capacity||'').trim();
      if(!c) return rec.capacity;
      return /kw/i.test(c) ? c : `${c}kw`;
    })(),
    inverter: row.inverterModel ? `${row.inverterModel}${row.inverterQty ? '*'+row.inverterQty : ''}` : rec.inverter,
    module: row.moduleModel || rec.module,
    deposit: row.deposit || row.totalAmount || 0,
    companyPrice: (() => {
      if(row.companyPrice) return -Math.abs(row.companyPrice);
      const fallback = computePerfCompanyPrice(row);
      return fallback ? -Math.abs(fallback) : 0;
    })(),
    extra: row.extra ? -Math.abs(row.extra) : 0,
  });
  updateNoteFirstLine(rec); // builds the auto first line, 추가비 placeholder, and 영업비용 summary
  if(!row.companyPrice){
    const noteIdx = findPerfModuleNoteIndex(row);
    if(noteIdx >= 0){
      rec.usedModuleNoteIndex = noteIdx; // read by createSalesCaseFromRows to sync the case-level checklist
      updateNoteModuleLineByIndex(rec, noteIdx);
    }
  }
  if(row.extraNote){
    // 추가비내역 can itself span several lines (e.g. "전선추가비 5만원\n구조물 추가비 60만원") —
    // collapse it to one line when placing it on the 비고's 추가비 line.
    const oneLine = String(row.extraNote).split('\n').map(s=>s.trim()).filter(Boolean).join(', ');
    const lines = rec.note.split('\n');
    const idx = lines.findIndex(l=>l.trim().startsWith('추가비'));
    if(idx>=0) lines[idx] = `추가비 : ${oneLine}`;
    else lines.push(`추가비 : ${oneLine}`);
    rec.note = lines.join('\n');
  }
  return rec;
}

function computeFinalSalesCost(customerDeposit, companyPrice, extra){
  const deposit = Number(customerDeposit)||0;
  if(!deposit) return 0;
  const vat = -Math.round(deposit/11);
  const cp = -(Math.abs(Number(companyPrice)||0));
  const ex = -(Math.abs(Number(extra)||0));
  const pay = Math.max(0, deposit + vat + cp + ex);
  return pay; // 3.3% 공제 전 금액 (사업 이윤정산의 영업비는 세전 금액을 사용)
}

function createCaseFromImportRow(row, type){
  if(!row) return;
  if(type === 'sales'){
    createSalesCaseFromRows([row]);
  } else {
    const p = newProfitCase();
    const modulePrices = PROFIT_MODULE_PRICES[row.moduleModel];
    const inverterPrices = PROFIT_INVERTER_PRICES[String(row.inverterModel||'').trim()];
    Object.assign(p, {
      customer: row.customer,
      constructionDate: row.date,
      capacityKw: parseFloat(row.capacity)||0,
      agentName: row.agent,
      teamName: row.team,
      totalBusinessCost: row.supplyAmount || (row.totalAmount ? Math.round(row.totalAmount/1.1) : 0),
      depositPrice: row.companyPrice ? Math.abs(row.companyPrice) : (computePerfCompanyPrice(row) || 0),
      moduleModel: row.moduleModel,
      moduleQty: row.moduleQty || 0,
      moduleBuy: modulePrices ? modulePrices.buy : 0,
      moduleSell: modulePrices ? modulePrices.sell : 0,
      inverterModel: row.inverterModel,
      inverterQty: row.inverterQty || 0,
      inverterBuy: inverterPrices ? inverterPrices.buy : 0,
      inverterSell: inverterPrices ? inverterPrices.sell : 0,
      structureNote: row.structureType,
      customerDeposit: row.deposit || row.totalAmount || 0,
      salesCost: (row.deposit || row.totalAmount)
        ? computeFinalSalesCost(row.deposit || row.totalAmount, row.companyPrice || computePerfCompanyPrice(row) || 0, row.extra)
        : (row.salesCost || row.finalSalesCost || 0),
      salesDeduction: Math.abs(row.extra) || 0,
      salesDeductionNote: row.extraNote || '',
      constructionCost: computeConstructionCost(parseFloat(row.capacity)||0),
    });
    applyAttachedStructurePricing(p);
    state.activeTab = 'profit';
    activeCase = p;
    state.activeId = p.id;
    persistCase(p);
    renderSidebar();
    renderMain();
  }
}

// Creates a single 영업비 정산 case containing one record per given row —
// used for both single-row and multi-select bulk settlement.
function createSalesCaseFromRows(rows){
  if(!rows || rows.length===0) return;
  const c = newCase();
  const firstAgent = rows.find(r=>r.agent)?.agent;
  if(firstAgent) c.agentName = firstAgent;
  c.records = rows.map(row => buildSalesRecordFromRow(row, c.defaultCorp));
  c.records.forEach(rec=>{
    if(typeof rec.usedModuleNoteIndex === 'number'){
      c.moduleChecks[rec.usedModuleNoteIndex] = true;
    }
    [rec.module, rec.module2].forEach(label=>{
      const idx = MODULE_OPTION_LABELS.indexOf(label);
      if(idx >= 0) c.moduleChecks[idx] = true;
    });
  });
  c.moduleNotes = computeModuleNotes(c.moduleChecks);
  autoUpdateTitle(c);
  state.activeTab = 'sales';
  activeCase = c;
  state.activeId = c.id;
  persistCase(c);
  renderSidebar();
  renderMain();
}

function setupStickyHScroll(wrapId, stickyId){
  const wrap = document.getElementById(wrapId);
  const sticky = document.getElementById(stickyId);
  if(!wrap || !sticky) return;
  const inner = sticky.querySelector('.sticky-hscroll-inner');
  inner.style.width = wrap.scrollWidth + 'px';
  let syncing = false;
  wrap.addEventListener('scroll', ()=>{
    if(syncing) return;
    syncing = true;
    sticky.scrollLeft = wrap.scrollLeft;
    requestAnimationFrame(()=>{ syncing = false; });
  });
  sticky.addEventListener('scroll', ()=>{
    if(syncing) return;
    syncing = true;
    wrap.scrollLeft = sticky.scrollLeft;
    requestAnimationFrame(()=>{ syncing = false; });
  });
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed to load '+src));
    document.head.appendChild(s);
  });
}

async function exportPerfListToExcel(){
  const btn = document.getElementById('exportPerfExcelBtn');
  const originalLabel = btn.textContent;
  btn.textContent = '내보내는 중…';
  btn.disabled = true;
  try{
    await loadXlsxLib();
    const rows = importState.mode === 'manual' ? importState.manualRows : importState.rows;
    if(!rows || rows.length===0){
      alert('내보낼 데이터가 없습니다.');
      return;
    }

    const headerLabels = ['No.', ...PERF_COLUMNS.map(([,label])=>label)];
    const aoa = [headerLabels];
    rows.forEach((r,i)=>{
      const line = [i+1];
      PERF_COLUMNS.forEach(([field,,type])=>{
        const v = r[field];
        line.push(type==='number' ? (Number(v)||0) : (v||''));
      });
      aoa.push(line);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    // Column widths: a little roomier for text-heavy columns, tighter for short ones.
    ws['!cols'] = [{wch:5}, ...PERF_COLUMNS.map(([field])=>{
      if(['address','structureType','extraNote','note','moduleModel'].includes(field)) return {wch:26};
      if(['corp','customer','agent','team','inverterModel'].includes(field)) return {wch:14};
      if(['totalAmount','deposit','supplyAmount','companyPrice','extra','salesCost','finalSalesCost','receivable'].includes(field)) return {wch:13};
      return {wch:11};
    })];
    // Freeze the header row so it stays visible while scrolling.
    ws['!freeze'] = { xSplit: 0, ySplit: 1 };

    const wb = XLSX.utils.book_new();
    const sheetName = (importState.sheetName || '실적데이터').slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);

    const fname = `실적리스트_${importState.mode==='manual'?'직접입력':(importState.fileName.replace(/\.xlsx?$/i,'')||'실적데이터')}_${isoDate(new Date())}.xlsx`;
    XLSX.writeFile(wb, fname);
  }catch(err){
    console.error(err);
    alert('엑셀로 내보내는 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
  }finally{
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

async function savePdf(){
  const btn = document.getElementById('pdfSaveBtn');
  const originalLabel = btn.textContent;
  btn.textContent = 'PDF 생성 중…';
  btn.disabled = true;
  try{
    await loadPdfLibs();
    const { jsPDF } = window.jspdf;
    const pages = [...document.querySelectorAll('#printSheet .doc-page')];
    if(pages.length === 0) return;

    let pdf = null;
    for(let i=0; i<pages.length; i++){
      const pageEl = pages[i];
      const isLandscape = pageEl.classList.contains('landscape');
      const canvas = await html2canvas(pageEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);

      const orientation = isLandscape ? 'landscape' : 'portrait';
      if(!pdf){
        pdf = new jsPDF({ orientation, unit:'mm', format:'a4' });
      } else {
        pdf.addPage('a4', orientation);
      }
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = isLandscape ? 8 : 10;
      const availW = pageW - margin*2;
      const availH = pageH - margin*2;
      const imgRatio = canvas.height / canvas.width;
      let drawW = availW;
      let drawH = drawW * imgRatio;
      if(drawH > availH){ drawH = availH; drawW = drawH / imgRatio; }
      const x = (pageW - drawW)/2;
      const y = margin;
      pdf.addImage(imgData, 'JPEG', x, y, drawW, drawH);
    }

    const c = activeCase;
    const fname = c ? (c.caseType==='profit' ? `사업정산내역서_${c.customer||'무제'}` : `영업비정산_${(c.title||'무제').replace(/[\\/:*?"<>|]/g,'')}`) : '정산문서';
    pdf.save(`${fname}.pdf`);
  }catch(err){
    console.error(err);
    alert('PDF 생성 중 오류가 발생했습니다. 인터넷 연결을 확인하시거나, 인쇄 버튼으로 인쇄 대화상자에서 "PDF로 저장"을 이용해주세요.');
  }finally{
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

function openPrintWindow(contentHtml, pageCss){
  const styleText = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const fontLinks = [...document.querySelectorAll('link[href*="fonts.googleapis.com"]')].map(l=>l.outerHTML).join('');

  let printWindow = null;
  try{ printWindow = window.open('', '_blank'); }catch(e){ printWindow = null; }

  if(printWindow){
    try{
      printWindow.document.open();
      printWindow.document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>인쇄</title>' +
        '<link rel="preconnect" href="https://fonts.googleapis.com">' +
        fontLinks +
        '<style>' + styleText + ' body{background:#fff;padding:20px;} .doc-page{box-shadow:none;margin:0 auto 24px;} @page{ ' + pageCss + ' }</style>' +
        '</head><body><div class="print-sheet">' + contentHtml + '</div></body></html>'
      );
      printWindow.document.close();
      let printed = false;
      const triggerPrint = () => { if(printed) return; printed = true; try{ printWindow.focus(); printWindow.print(); }catch(e){} };
      // Wait for the web fonts to actually finish loading before printing —
      // otherwise the print renders with a fallback system font whose sizing
      // and letter-spacing differ from the on-screen preview.
      const waitAndPrint = () => {
        if(printWindow.document.fonts && printWindow.document.fonts.ready){
          printWindow.document.fonts.ready.then(triggerPrint).catch(triggerPrint);
        } else {
          triggerPrint();
        }
      };
      printWindow.onload = waitAndPrint;
      setTimeout(waitAndPrint, 1200); // fallback in case onload/fonts.ready is slow or doesn't fire
      return;
    }catch(e){
      try{ printWindow.close(); }catch(e2){}
    }
  }
  // Fallback for environments where opening a new window is blocked (e.g. a
  // sandboxed iframe without allow-popups): print the current document.
  try{ window.print(); }catch(e){}
}

// 8자 이상 + 숫자 1개 이상 + 특수문자 1개 이상 (Firebase 자체 최소 6자 규칙보다 강화)
function isPasswordStrongEnough(pw){
  return pw.length >= 8 && /[0-9]/.test(pw) && /[!@#$%^&*(),.?":{}|<>_\-+=~`\[\]\\/;']/.test(pw);
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmailInput').value.trim();
  const password = document.getElementById('authPasswordInput').value;
  const errEl = document.getElementById('authErrorMsg');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }

  const btn = document.getElementById('authSubmitBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = '처리 중…';
  try{
    if(authMode === 'signup'){
      const confirm = document.getElementById('authPasswordConfirmInput').value;
      if(password !== confirm){ errEl.textContent = '비밀번호가 서로 다릅니다.'; return; }
      if(!isPasswordStrongEnough(password)){
        errEl.textContent = '비밀번호는 8자 이상이면서 숫자와 특수문자를 각각 하나 이상 포함해야 합니다.';
        return;
      }
      const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
      await fbDb.collection('users').doc(cred.user.uid).set({
        email, approved: email===ADMIN_EMAIL, rejected: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      // onAuthStateChanged below will pick up the new signed-in user and route accordingly.
    } else {
      await fbAuth.signInWithEmailAndPassword(email, password);
    }
  }catch(e){
    errEl.textContent = authFriendlyError(e);
  }finally{
    btn.disabled = false; btn.textContent = original;
  }
}
document.getElementById('authSubmitBtn').addEventListener('click', handleAuthSubmit);
document.getElementById('authPasswordConfirmInput').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
document.getElementById('authPasswordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });

function authFriendlyError(e){
  const code = e && e.code || '';
  if(code==='auth/email-already-in-use') return '이미 가입된 이메일입니다. 로그인을 이용해주세요.';
  if(code==='auth/invalid-email') return '이메일 형식이 올바르지 않습니다.';
  if(code==='auth/weak-password') return '비밀번호는 6자 이상이어야 합니다.';
  if(code==='auth/wrong-password' || code==='auth/invalid-credential') return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if(code==='auth/user-not-found') return '가입되지 않은 이메일입니다.';
  return e && e.message ? e.message : '오류가 발생했습니다.';
}

document.getElementById('authLogoutBtn2').addEventListener('click', ()=>fbAuth.signOut());
document.getElementById('authAdminLogoutBtn').addEventListener('click', ()=>fbAuth.signOut());
document.getElementById('authAdminEnterBtn').addEventListener('click', startApp);

async function renderAdminList(){
  const listEl = document.getElementById('authAdminList');
  listEl.innerHTML = '불러오는 중…';
  try{
    const snap = await fbDb.collection('users').orderBy('createdAt', 'desc').get();
    if(snap.empty){ listEl.innerHTML = '<div style="color:var(--muted); font-size:13px;">가입된 사용자가 없습니다.</div>'; return; }
    listEl.innerHTML = snap.docs.map(doc => {
      const d = doc.data();
      const isAdmin = d.email === ADMIN_EMAIL;
      const statusLabel = d.approved ? '승인됨' : (d.rejected ? '거절됨' : '승인 대기');
      const statusColor = d.approved ? 'var(--pos)' : (d.rejected ? 'var(--neg)' : 'var(--muted)');
      let actionsHtml = '';
      if(!isAdmin){
        if(d.approved){
          actionsHtml = `<button class="admin-revoke-btn" data-id="${doc.id}" style="font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--neg); cursor:pointer;">승인 취소</button>`;
        } else if(d.rejected){
          actionsHtml = `<button class="admin-unreject-btn" data-id="${doc.id}" style="font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">대기로 되돌리기</button>`;
        } else {
          actionsHtml = `
            <button class="admin-approve-btn" data-id="${doc.id}" style="font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--pos); background:transparent; color:var(--pos); cursor:pointer;">승인하기</button>
            <button class="admin-reject-btn" data-id="${doc.id}" style="font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--neg); background:transparent; color:var(--neg); cursor:pointer; margin-left:6px;">거절하기</button>`;
        }
      }
      return `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:8px;">
        <div>
          <div style="font-size:13.5px;">${escapeHtml(d.email||'(이메일 없음)')}${isAdmin ? ' <span style="color:var(--gold); font-size:11px;">(관리자)</span>' : ''}</div>
          <div style="font-size:11px; color:${statusColor};">${statusLabel}</div>
        </div>
        <div>${actionsHtml}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.admin-approve-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await fbDb.collection('users').doc(btn.dataset.id).update({ approved:true, rejected:false });
        renderAdminList();
      });
    });
    listEl.querySelectorAll('.admin-reject-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await fbDb.collection('users').doc(btn.dataset.id).update({ approved:false, rejected:true });
        renderAdminList();
      });
    });
    listEl.querySelectorAll('.admin-unreject-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await fbDb.collection('users').doc(btn.dataset.id).update({ approved:false, rejected:false });
        renderAdminList();
      });
    });
    listEl.querySelectorAll('.admin-revoke-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await fbDb.collection('users').doc(btn.dataset.id).update({ approved:false, rejected:false });
        renderAdminList();
      });
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = '<div style="color:var(--neg); font-size:13px;">목록을 불러오지 못했습니다. Firestore 보안 규칙을 확인해주세요.</div>';
  }
}

document.getElementById('appLogoutBtn').addEventListener('click', ()=>fbAuth.signOut());

let isAdminUser = false;

fbAuth.onAuthStateChanged(async (user) => {
  if(!user){
    isAdminUser = false;
    document.getElementById('adminApprovalTabBtn').style.display = 'none';
    document.getElementById('app').classList.remove('show');
    document.getElementById('authOverlay').style.display = 'flex';
    showAuthView('forms');
    setAuthMode('login');
    return;
  }
  if(user.email === ADMIN_EMAIL){
    isAdminUser = true;
    document.getElementById('adminApprovalTabBtn').style.display = 'flex';
    startApp();
    return;
  }
  try{
    const doc = await fbDb.collection('users').doc(user.uid).get();
    const data = doc.exists ? doc.data() : {};
    const approved = data.approved === true;
    const rejected = data.rejected === true;
    if(approved){
      startApp(Array.isArray(data.allowedTabs) ? data.allowedTabs : null);
    } else {
      document.getElementById('authOverlay').style.display = 'flex';
      if(rejected){
        document.getElementById('authPendingTitle').textContent = '가입 신청이 거절되었습니다.';
        document.getElementById('authPendingDesc').textContent = '자세한 사항은 관리자에게 문의해주세요.';
      } else {
        document.getElementById('authPendingTitle').textContent = '가입 신청이 접수되었습니다.';
        document.getElementById('authPendingDesc').textContent = '관리자 승인 후 이용할 수 있습니다. 승인되면 다시 로그인해주세요.';
      }
      showAuthView('pending');
    }
  }catch(e){
    console.error(e);
    document.getElementById('authErrorMsg').textContent = '상태를 확인하지 못했습니다. 새로고침해주세요.';
    showAuthView('forms');
  }
});
</script>
