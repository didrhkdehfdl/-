// Builds an .xlsx that mirrors the reference workbook's "정산데이터" sheet
// exactly: same 3-row grouped header (top group / field / sub-field) and
// the same 50-column layout (a blank column A, then No. through 영업이익률
// in columns B..AY), with one data row per 사업 이윤정산 case.
async function exportProfitListToExcel(cases){
  const btn = document.getElementById('profitListExportBtn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '내보내는 중…'; btn.disabled = true; }
  try{
    await loadXlsxLib();
    if(!cases || cases.length===0){ alert('내보낼 사업 이윤정산 건이 없습니다.'); return; }

    const nCols = PROFIT_LIST_COLUMNS.length; // 50, occupying columns B..AY (1-indexed 2..51)
    const blankRow = () => new Array(nCols+1).fill('');

    // Row 0: top group header (merged spans)
    const row0 = blankRow();
    const groupHeaders = groupProfitListColumns();
    groupHeaders.forEach(g => { row0[1+g.colStart] = g.label; });

    // Row 1: field header (모듈/인버터/구조물/부가세 merged spans; everything else rowspans into row 2)
    const row1 = blankRow();
    const fieldHeaders = groupProfitListFields();
    fieldHeaders.forEach(g => { row1[1+g.colStart] = g.label; });

    // Row 2: sub-field header (모델명/수량/구매단가/판매단가/판매총액, 금액/부담)
    const row2 = blankRow();
    PROFIT_LIST_COLUMNS.forEach((col, i) => { if(col.sub!==null) row2[1+i] = col.sub; });

    const dataRows = cases.map((p, i) => {
      const v = computeProfitListRowValues(p, i);
      const row = blankRow();
      PROFIT_LIST_COLUMNS.forEach((col, ci) => {
        const val = v[col.key];
        row[1+ci] = col.type === 'pct' ? val : (col.type === 'num' ? (Number(val)||0) : (val||''));
      });
      return row;
    });

    const aoa = [row0, row1, row2, ...dataRows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);

    // Merges: group row spans, field row spans (모듈/인버터/구조물/부가세),
    // and rowspans (row1:row2) for every field that has no sub-split —
    // matching the reference workbook's merge layout column-for-column.
    const merges = [];
    groupHeaders.forEach(g => {
      if(g.colSpan>1) merges.push({ s:{r:0,c:1+g.colStart}, e:{r:0,c:1+g.colStart+g.colSpan-1} });
    });
    fieldHeaders.forEach(g => {
      if(g.hasSub){
        if(g.colSpan>1) merges.push({ s:{r:1,c:1+g.colStart}, e:{r:1,c:1+g.colStart+g.colSpan-1} });
      } else {
        merges.push({ s:{r:1,c:1+g.colStart}, e:{r:2,c:1+g.colStart} });
      }
    });
    ws['!merges'] = merges;

    ws['!cols'] = [{wch:3}, ...PROFIT_LIST_COLUMNS.map(col=>({wch:col.width||10}))];
    ws['!freeze'] = { xSplit: 0, ySplit: 3 };
    // Percent column (영업이익률) formatted as a real percentage
    const pctColIdx = PROFIT_LIST_COLUMNS.findIndex(c=>c.type==='pct');
    if(pctColIdx>=0){
      const colLetter = XLSX.utils.encode_col(1+pctColIdx);
      for(let r=0; r<dataRows.length; r++){
        const cellRef = `${colLetter}${4+r}`;
        if(ws[cellRef]) ws[cellRef].z = '0.0%';
      }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '정산데이터');
    XLSX.writeFile(wb, `사업이윤정산_목록_${isoDate(new Date())}.xlsx`);
  }catch(err){
    console.error(err);
    alert('엑셀로 내보내는 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
  }finally{
    if(btn){ btn.textContent = originalLabel; btn.disabled = false; }
  }
}

// 구조물 분류(structureNote)에 "부착형"이 포함되어 있으면, 3kw당 구매가
// 187,495원 / 판매가 220,000원을 자동으로 적용하고, 수량도 용량 기준
// (capacityKw/3)으로 맞춘다. 슬라브형 등 다른 표기는 건드리지 않는다.
function applyAttachedStructurePricing(p){
  if(/부착형/.test(p.structureNote||'')){
    p.structureBuy = 187495;
    p.structureSell = 220000;
    p.structureQty = (Number(p.capacityKw)||0) / 3;
    return true;
  }
  return false;
}

// ---------- 사업 이윤정산 → "정산데이터" 통합 엑셀에 기록 ----------
// 카드관리와 같은 이유로 이 통합 엑셀 파일도 저장해두지 않는다 — 여러 사람이
// 같이 쓰는 "지금 이 순간의 최신본"이라, 캐시된 옛 버전을 계속 다시 써버리면
// 그사이 다른 사람이 채워넣은 행을 덮어쓸 위험이 있다. 매번 새로 올린다.
let profitLedgerState = { open:false, buffer:null, fileName:'', busy:false, error:'', message:'' };
const PROFIT_LEDGER_SHEET = '정산데이터';
// 같은 고객명을 쓰는 영업비 정산 건(케이스+레코드)을 전체 건 목록에서 찾는다.
// 이 앱에서는 영업비 정산 건과 이윤정산 건이 서로 다른 화면에서 따로 관리되지만,
// "정산데이터" 시트는 같은 고객의 두 정보를 한 행에 합쳐 담는 형식이라 필요하다.
function findMatchingSalesRecord(customerName){
  const name = String(customerName||'').trim();
  if(!name) return null;
  for(const c of state.cases){
    if(c.caseType !== 'sales' || !c.records) continue;
    const rec = c.records.find(r => String(r.customer||'').trim() === name);
    if(rec) return { salesCase:c, record:rec };
  }
  return null;
}
// 구조물 판매단가(정산데이터 AC열): 부착형이면 3kW당 22만원, 그 외에는
// 구매단가×1.2 하되 3kW당 50만원을 넘지 않도록 — 용량에 비례해서 커진다.
function computeLedgerStructureSell(profitCase, salesRecord){
  const kwFactor = (Number(profitCase.capacityKw)||0) / 3;
  const isAttached = /부착형/.test((salesRecord && salesRecord.structureType) || '');
  if(isAttached) return Math.round(220000 * kwFactor);
  const capped = Math.round(500000 * kwFactor);
  const scaled = Math.round((Number(profitCase.structureBuy)||0) * 1.2);
  return Math.min(scaled, capped);
}

function wireProfitLedgerPanel(p){
  const s = profitLedgerState;
  const fileInput = document.getElementById('ledgerFileInput');
  if(fileInput) fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    s.error=''; s.message='';
    try{
      s.buffer = await file.arrayBuffer();
      s.fileName = file.name;
    }catch(err){ s.error = '파일을 읽지 못했습니다: '+err.message; }
    renderProfitMain();
  });
  const writeBtn = document.getElementById('ledgerWriteBtn');
  if(writeBtn) writeBtn.addEventListener('click', async ()=>{
    s.error=''; s.message=''; s.busy=true; renderProfitMain();
    try{
      const match = findMatchingSalesRecord(p.customer);
      const result = await writeProfitCaseToLedger(s.buffer, p, match);
      if(result.error){
        s.error = result.error;
      }else{
        const url = URL.createObjectURL(result.blob);
        const a = document.createElement('a');
        a.href = url;
        const base = (s.fileName||'정산데이터.xlsx').replace(/\.xlsx$/i,'');
        a.download = `${base}_${escapeHtml(p.customer)||'업데이트'}_${isoDate(new Date())}.xlsx`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        s.message = result.wasNewRow ? `새 행(${result.rowNum}행)에 기록했습니다.` : `기존 ${result.rowNum}행을 갱신했습니다.`;
      }
    }catch(err){
      s.error = '기록 중 오류가 발생했습니다: '+err.message;
    }
    s.busy=false;
    renderProfitMain();
  });
}
// 정산데이터 시트에 값을 채워 넣는다 — 카드관리와 같은 원리로, ZIP 안의 해당
// 시트 XML만 직접 수정해서 다른 시트·수식·서식을 절대 건드리지 않는다.
// 새 행을 만들 때는 마지막 데이터 행을 그대로 복제한 뒤(서식·수식이 같이 딸려옴)
// 행번호만 새로 바꾸고, 값 칸만 새 내용으로 덮어쓴다.
// 행 복제로는 안전하게 옮겨지지 않는 수식들 — 원본 파일에 "공유 수식(shared
// formula)" 팔로워 셀(자기 텍스트 없이 다른 셀의 수식을 참조)이 섞여 있어서,
// 그런 셀을 그대로 복제하면 빈 "=" 수식이 되어버린다. 그래서 이 열들은 항상
// 아래 정확한 수식 문구를 새 행 번호에 맞춰 직접 써넣는다(95행 실제 데이터로
// 검증한 내용).
const LEDGER_FORMULA_TEMPLATES = {
  M: n => `L${n}/1.1`,
  N: n => `M${n}*0.1`,
  T: n => `Q${n}*S${n}`,
  Y: n => `V${n}*X${n}`,
  AD: n => `AA${n}*AC${n}`,
  AF: n => `T${n}+Y${n}+AD${n}+AE${n}`,
  AM: n => `SUM(AG${n}:AL${n})`,
  AO: n => `M${n}`,
  AR: n => `AO${n}-AP${n}-AQ${n}`,
  AT: n => `VLOOKUP(K${n},단가표!$U$3:$X$8,3,TRUE)`,
  AV: n => `SUM(AT${n}:AU${n})`,
  AW: n => `M${n}-AF${n}-AM${n}-(AQ${n}+AR${n})`,
  AX: n => `AW${n}-AV${n}`,
  AY: n => `AX${n}/M${n}`,
};
async function writeProfitCaseToLedger(masterArrayBuffer, profitCase, salesMatch){
  await loadJSZipLib();
  const zip = await window.JSZip.loadAsync(masterArrayBuffer);
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const SS_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

  const wbFile = zip.file('xl/workbook.xml');
  if(!wbFile) return { error: '엑셀 구조를 인식할 수 없습니다(workbook.xml 없음).' };
  const wbXmlText = await wbFile.async('string');
  const wbDoc = parser.parseFromString(wbXmlText, 'application/xml');
  const sheetEl = Array.from(wbDoc.getElementsByTagName('sheet')).find(el => el.getAttribute('name') === PROFIT_LEDGER_SHEET);
  if(!sheetEl) return { error: `"${PROFIT_LEDGER_SHEET}" 시트를 찾을 수 없습니다.` };
  const rId = sheetEl.getAttributeNS(REL_NS, 'id');

  const relsFile = zip.file('xl/_rels/workbook.xml.rels');
  if(!relsFile) return { error: '워크북 관계 정보를 찾을 수 없습니다.' };
  const relsText = await relsFile.async('string');
  const relsDoc = parser.parseFromString(relsText, 'application/xml');
  const relEl = Array.from(relsDoc.getElementsByTagName('Relationship')).find(el => el.getAttribute('Id') === rId);
  if(!relEl) return { error: '시트 경로 정보를 찾을 수 없습니다.' };
  let target = (relEl.getAttribute('Target')||'').replace(/^\.?\//,'');
  const sheetPath = target.startsWith('xl/') ? target : ('xl/' + target);
  const sheetFile = zip.file(sheetPath);
  if(!sheetFile) return { error: `시트 파일(${sheetPath})을 찾을 수 없습니다.` };

  let sharedStrings = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if(ssFile){
    const ssText = await ssFile.async('string');
    const ssDoc = parser.parseFromString(ssText, 'application/xml');
    sharedStrings = Array.from(ssDoc.getElementsByTagName('si')).map(si =>
      Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')
    );
  }

  const sheetXmlText = await sheetFile.async('string');
  const sheetDoc = parser.parseFromString(sheetXmlText, 'application/xml');
  const sheetDataEl = sheetDoc.getElementsByTagName('sheetData')[0];
  if(!sheetDataEl) return { error: '시트 데이터 영역을 찾을 수 없습니다.' };
  const rowEls = Array.from(sheetDataEl.getElementsByTagName('row'));

  function findCell(rowEl, colLetter){
    const rowNum = rowEl.getAttribute('r');
    return Array.from(rowEl.getElementsByTagName('c')).find(el => el.getAttribute('r') === colLetter+rowNum) || null;
  }
  function cellText(rowEl, colLetter){
    const c = findCell(rowEl, colLetter);
    if(!c) return '';
    const t = c.getAttribute('t');
    if(t === 's'){
      const vEl = c.getElementsByTagName('v')[0];
      const idx = vEl ? parseInt(vEl.textContent,10) : -1;
      return sharedStrings[idx] || '';
    }
    if(t === 'inlineStr'){
      const isEl = c.getElementsByTagName('is')[0];
      return isEl ? Array.from(isEl.getElementsByTagName('t')).map(t=>t.textContent).join('') : '';
    }
    const vEl = c.getElementsByTagName('v')[0];
    return vEl ? vEl.textContent : '';
  }

  // 헤더 안전 점검
  const headerRow = rowEls.find(r => r.getAttribute('r') === '4');
  if(headerRow){
    const expected = { C:'고객명', L:'총사업비', AP:'회사입금가' };
    for(const [col,label] of Object.entries(expected)){
      const txt = cellText(headerRow, col).replace(/\s/g,'');
      if(txt && !txt.includes(label)){
        return { error: `"${PROFIT_LEDGER_SHEET}" 시트의 열 구성이 예상과 달라 안전하게 처리할 수 없습니다 (${col}열: "${txt}"). 수동 확인이 필요합니다.` };
      }
    }
  }

  const dataRows = rowEls.filter(r => Number(r.getAttribute('r')) >= 6);
  const customerName = String(profitCase.customer||'').trim();
  const matchingRows = customerName ? dataRows.filter(r => cellText(r,'C').trim() === customerName) : [];
  if(matchingRows.length > 1){
    const rowNums = matchingRows.map(r=>r.getAttribute('r')).join(', ');
    return { error: `"${customerName}" 이름이 이미 ${matchingRows.length}개 행(${rowNums}행)에 있어서 어느 행을 갱신해야 할지 자동으로 정할 수 없습니다. 엑셀에서 중복 행을 정리하신 뒤 다시 시도해주세요.` };
  }
  let targetRow = matchingRows[0] || null;
  let wasNewRow = false;
  let newRowNum = null;

  if(!targetRow){
    // 새 행: 마지막으로 값이 채워진 행을 찾아 복제(서식·수식 그대로 딸려옴).
    let lastFilled = null;
    for(const r of dataRows){
      if(cellText(r,'C').trim()) lastFilled = r;
    }
    if(!lastFilled) return { error: '기존 데이터 행을 찾지 못해 새 행의 서식을 복제할 수 없습니다.' };
    const oldRowNum = lastFilled.getAttribute('r');
    newRowNum = String(Number(oldRowNum)+1);
    const cloned = lastFilled.cloneNode(true);
    cloned.setAttribute('r', newRowNum);
    Array.from(cloned.getElementsByTagName('c')).forEach(c=>{
      const ref = c.getAttribute('r')||'';
      const col = ref.replace(/\d+$/,'');
      c.setAttribute('r', col+newRowNum);
      const template = LEDGER_FORMULA_TEMPLATES[col];
      const fEls = Array.from(c.getElementsByTagName('f'));
      if(template){
        // 이 열은 공식이 정해져 있으니(shared-formula 팔로워라 텍스트가 비어
        // 있을 위험을 피하려고) 항상 정확한 수식을 직접 써넣는다.
        while(c.firstChild) c.removeChild(c.firstChild);
        c.removeAttribute('t');
        const fEl = sheetDoc.createElementNS(SS_NS, 'f');
        fEl.textContent = template(newRowNum);
        c.appendChild(fEl);
      }else if(fEls.length){
        fEls.forEach(fEl=>{
          fEl.removeAttribute('t');
          fEl.removeAttribute('ref');
          fEl.removeAttribute('si');
          const re = new RegExp('([A-Z]{1,3})' + oldRowNum + '(?!\\d)', 'g');
          fEl.textContent = fEl.textContent.replace(re, '$1'+newRowNum);
        });
      }
    });
    // 이 행 번호가 이미 (내용은 비어있지만) 예약된 행으로 존재하는 경우가 있다
    // — 실제로 이 파일에서 데이터가 없는 행에 번호(B열)만 미리 채워둔 구간이
    // 있었다. 그런 행과 번호가 겹치면 새로 끼워넣지 말고 그 자리를 대신 채운다
    // (그 행에 남아있던 B열 값 등은 보존).
    const existingStub = rowEls.find(r => r.getAttribute('r') === newRowNum);
    if(existingStub){
      const stubB = findCell(existingStub, 'B');
      if(stubB && stubB.textContent.trim()){
        let clonedB = findCell(cloned, 'B');
        if(!clonedB){
          clonedB = sheetDoc.createElementNS(SS_NS,'c');
          clonedB.setAttribute('r', 'B'+newRowNum);
          cloned.insertBefore(clonedB, cloned.firstChild);
        }
        while(clonedB.firstChild) clonedB.removeChild(clonedB.firstChild);
        Array.from(stubB.attributes).forEach(a=>{ if(a.name!=='r') clonedB.setAttribute(a.name, a.value); });
        Array.from(stubB.childNodes).forEach(ch=>clonedB.appendChild(ch.cloneNode(true)));
      }
      existingStub.parentNode.replaceChild(cloned, existingStub);
    }else{
      lastFilled.parentNode.insertBefore(cloned, lastFilled.nextSibling);
    }
    targetRow = cloned;
    wasNewRow = true;
  }

  const r = computeProfitCase(profitCase);
  const rec = salesMatch ? salesMatch.record : null;
  const salesCase = salesMatch ? salesMatch.salesCase : null;
  const structureSell = computeLedgerStructureSell(profitCase, rec);

  const plainValues = {
    C: profitCase.customer || '',
    D: profitCase.branch || '',
    E: profitCase.constructionDate ? isoDate(new Date(profitCase.constructionDate)) : '',
    F: '#N/A',
    G: rec ? (rec.corp||'') : '',
    H: salesCase ? (salesCase.agentName||'') : '',
    I: 'X',
    J: profitCase.teamName || '',
    K: Number(profitCase.capacityKw)||0,
    L: Number(profitCase.totalBusinessCost)||0,
    O: '사무실',
    P: profitCase.moduleModel || '',
    Q: Number(profitCase.moduleQty)||0,
    R: Number(profitCase.moduleBuy)||0,
    S: Number(profitCase.moduleSell)||0,
    U: profitCase.inverterModel || '',
    V: Number(profitCase.inverterQty)||0,
    W: Number(profitCase.inverterBuy)||0,
    X: Number(profitCase.inverterSell)||0,
    Z: profitCase.structureNote || '',
    AA: Number(profitCase.structureQty)||0,
    AB: Number(profitCase.structureBuy)||0,
    AC: structureSell,
    AE: Number(profitCase.etcMaterial)||0,
    AG: Number(profitCase.structureReviewCost)||0,
    AH: Number(profitCase.designSupervisionCost)||0,
    AI: Number(profitCase.inspectionFeeCost)||0,
    AJ: Number(profitCase.constructionCost)||0,
    AK: Number(profitCase.etcAgencyCost)||0,
    AP: rec ? (Number(rec.companyPrice)||0) : '',
    AQ: Number(profitCase.salesDeduction)||0,
    AS: profitCase.salesDeductionNote || '',
    AU: Number(profitCase.maintenanceCost)||0,
  };
  const dateCols = new Set(['E']);
  const numericCols = new Set(['K','L','Q','R','S','V','W','X','AA','AB','AC','AE','AG','AH','AI','AJ','AK','AP','AQ','AU']);

  Object.entries(plainValues).forEach(([col, raw])=>{
    let cEl = findCell(targetRow, col);
    if(!cEl){
      cEl = sheetDoc.createElementNS(SS_NS,'c');
      cEl.setAttribute('r', col+targetRow.getAttribute('r'));
      targetRow.appendChild(cEl);
    }
    while(cEl.firstChild) cEl.removeChild(cEl.firstChild);
    if(dateCols.has(col) && raw){
      // 엑셀 날짜 일련번호로 저장(1900-01-01 기준) — 문자열로 넣으면 날짜 서식이 깨진다.
      const d = new Date(raw);
      const epoch = new Date(Date.UTC(1899,11,30));
      const days = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - epoch.getTime())/86400000);
      cEl.removeAttribute('t');
      const vEl = sheetDoc.createElementNS(SS_NS,'v');
      vEl.textContent = String(days);
      cEl.appendChild(vEl);
    }else if(numericCols.has(col)){
      cEl.removeAttribute('t');
      const vEl = sheetDoc.createElementNS(SS_NS,'v');
      vEl.textContent = String(Number(raw)||0);
      cEl.appendChild(vEl);
    }else{
      cEl.setAttribute('t','inlineStr');
      const isEl = sheetDoc.createElementNS(SS_NS,'is');
      const tEl = sheetDoc.createElementNS(SS_NS,'t');
      tEl.textContent = String(raw||'');
      isEl.appendChild(tEl);
      cEl.appendChild(isEl);
    }
  });

  zip.file(sheetPath, serializer.serializeToString(sheetDoc));

  let calcPr = wbDoc.getElementsByTagName('calcPr')[0];
  if(!calcPr){
    calcPr = wbDoc.createElementNS(SS_NS, 'calcPr');
    wbDoc.documentElement.appendChild(calcPr);
  }
  calcPr.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/workbook.xml', serializer.serializeToString(wbDoc));

  const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{level:6} });
  return { blob, wasNewRow, rowNum: targetRow.getAttribute('r') };
}

    const module2Prices = PROFIT_MODULE_PRICES[p.module2Model];
    if(module2Prices){ p.module2Buy = module2Prices.buy; p.module2Sell = module2Prices.sell; }
    const inverterPrices = PROFIT_INVERTER_PRICES[String(p.inverterModel||'').trim()];
    if(inverterPrices){ p.inverterBuy = inverterPrices.buy; p.inverterSell = inverterPrices.sell; }
    applyAttachedStructurePricing(p);
    const price = computePerfCompanyPrice({ moduleModel: p.moduleModel, structureType: p.structureNote });
    if(price !== null) p.depositPrice = price;
    p.constructionCost = computeConstructionCost(p.capacityKw);
    p.salesCost = computeFinalSalesCost(p.customerDeposit, p.depositPrice, p.salesDeduction);
    debouncedSave();
    renderProfitMain();
  });

  main.querySelectorAll('[data-pf]').forEach(inp=>{
    const isMoney = inp.dataset.numeric === 'true';
    const handler = () => {
      const key = inp.dataset.pf;
      let val;
      if(isMoney) val = parseFloat(String(inp.value).replace(/,/g,'')) || 0;
      else if(inp.type==='number') val = (inp.value===''?0:Number(inp.value));
      else val = inp.value;

        const idx = Number(key.split('-')[1]);
        p.laborNames[idx] = val;

        p[key] = inp.value; // keep as string; '' means "not overridden"
      } else {
        p[key] = val;
      }
      if(key === 'moduleModel'){
        const prices = PROFIT_MODULE_PRICES[val];
        if(prices){
          p.moduleBuy = prices.buy;
          p.moduleSell = prices.sell;
        }
      }
      if(key === 'module2Model'){
        const prices = PROFIT_MODULE_PRICES[val];
        if(prices){
          p.module2Buy = prices.buy;
          p.module2Sell = prices.sell;
        }
      }
      if(key === 'inverterModel'){
        const prices = PROFIT_INVERTER_PRICES[String(val).trim()];
        if(prices){
          p.inverterBuy = prices.buy;
          p.inverterSell = prices.sell;
        }
      }
      if(key === 'moduleModel' || key === 'structureNote'){
        const price = computePerfCompanyPrice({ moduleModel: p.moduleModel, structureType: p.structureNote });
        if(price !== null) p.depositPrice = price;
      }
      if(key === 'structureNote'){
        applyAttachedStructurePricing(p);
      }
      if(key === 'structureBuy'){
        p.structureSell = Math.round((Number(p.structureBuy)||0) * 1.2);
      }
      updateProfitCalculations();
      debouncedSave();
      if(key === 'moduleModel' || key === 'module2Model' || key === 'inverterModel' || key === 'structureNote') renderProfitMain();
    };
    let markupDirty = false;
    inp.addEventListener('input', ()=>{ markupDirty = true; handler(); });
    inp.addEventListener('change', handler);
    if(isMoney){
      inp.addEventListener('blur', ()=>{
        const markup = parseFloat(inp.dataset.markup);
        if(markup && markupDirty && p[inp.dataset.pf]){
          p[inp.dataset.pf] = Math.round(p[inp.dataset.pf] * markup);
          updateProfitCalculations();
          debouncedSave();
        }
        markupDirty = false;
        inp.value = p[inp.dataset.pf] ? Number(p[inp.dataset.pf]).toLocaleString('ko-KR') : '';
      });
    }
    if(['capacityKw','totalBusinessCost','depositPrice','structureBuy'].includes(inp.dataset.pf)){
      inp.addEventListener('blur', ()=>{
        if(inp.dataset.pf === 'capacityKw'){
          p.constructionCost = computeConstructionCost(p.capacityKw);
        }
        renderProfitMain();
      });
    }
  });

// Relative width (in %) for each PERF_COLUMNS field, used to build the
// wide tables' <colgroup> — text-heavy fields like 주소 get much more room
// so their content doesn't get clipped down to a sliver.
const PERF_COLUMN_WIDTH = {
  corp:3.5, date:3.5, customer:6, phone:8, rrn:6, address:15, capacity:4.5,
  totalAmount:5, moduleModel:12, moduleQty:2.2, inverterModel:3.5, inverterQty:2.2,

function perfColgroup(extraCols){
  const cols = [`<col style="width:2%">`, `<col style="width:2%">`];
  PERF_COLUMNS.forEach(([field])=>{
    cols.push(`<col style="width:${PERF_COLUMN_WIDTH[field]||3.5}%">`);
  });
  (extraCols||[]).forEach(w=> cols.push(`<col style="width:${w}%">`));
  return `<colgroup>${cols.join('')}</colgroup>`;
}

function normalizeHeader(s){
  return String(s??'').replace(/\s+/g,'');
}
function normalizeDateString(s){
  s = s.trim();
  if(!s) return s;
  let m = s.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일?$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // Short US-style date (e.g. Excel's locale-default "1/8/26" or "1/8/2026"),
  // interpreted as month/day/year since that's Excel's common short-date default.
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if(m){
    const month = String(m[1]).padStart(2,'0');
    const day = String(m[2]).padStart(2,'0');
    const year = m[3].length===2 ? `20${m[3]}` : m[3];
    return `${year}-${month}-${day}`;
  }
  return s; // leave unrecognized text as-is (free text, not a date we can normalize)
}
// Some free-text columns (like 비고) can have a resident registration
// number typed inline as part of a note (e.g. "박미식(590326-2011213) ...").
// We deliberately don't collect that field, so strip any such pattern out
// before storing/displaying the rest of the note.
function redactRRN(s){
  if(!s) return s;
  return String(s).replace(/\d{6}-\d{7}/g, '[주민번호 비공개]');
}

function excelDateToIso(v){
  if(v instanceof Date) return isoDate(v);
  if(v===null || v===undefined || v==='') return '';
  // Some date cells come through as a raw Excel serial number (days since
  // 1899-12-30) rather than a Date object or formatted string.
  if(typeof v === 'number' && v > 20000 && v < 60000){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if(!isNaN(d.getTime())) return isoDate(d);
  }
  const str = String(v).trim();
  // Some cells (e.g. multi-installment 입금일자/발행일자) hold several dates
  // separated by newlines as plain text rather than a single date value —
  // normalize each line individually so the multi-date structure survives.
  if(str.includes('\n')) return str.split('\n').map(line=>normalizeDateString(line)).join('\n');
  return normalizeDateString(str);
}
// Excel cells formatted with thousands separators / currency symbols come
// through the reader as text (e.g. "8,100,000" or "₩8,100,000") rather than
// a raw number — strip that formatting before parsing so amounts don't
// silently collapse to 0.
function parseExcelNumber(v){
  if(typeof v === 'number') return v;
  if(v===null || v===undefined || v==='') return 0;
  const cleaned = String(v).replace(/[₩$,\s]/g,'');
  const n = Number(cleaned);
  return isNaN(n) ? 0 : n;
}

async function ensureContractsLoaded(){
  if(contractsState.loaded || contractsState.loading) return;
  contractsState.loading = true;
  contractsState.items = await loadContractsIndex();
  contractsState.loading = false;
  contractsState.loaded = true;
}

function sortedContracts(){
  const items = [...contractsState.items];
  items.sort((a,b)=>{
    const da = a.date || '9999-99-99'; // blanks sort to the end
    const db = b.date || '9999-99-99';
    if(da !== db) return contractsState.sortOrder==='asc' ? da.localeCompare(db) : db.localeCompare(da);
    return a.fileName.localeCompare(b.fileName);
  });
  return items;
}

// Exports every contract's metadata AND its actual file bytes (base64) as
// one JSON file — a scoped backup/restore just for the 계약서 tab, separate
// from the sidebar's case-only 내보내기/가져오기.
async function exportContractsBackup(){
  const btn = document.getElementById('contractExportBtn');
  const original = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '내보내는 중…'; btn.disabled = true; }
  try{
    const items = contractsState.items;
    const files = {};
    for(const item of items){
      const base64 = await loadContractFileData(item.id);
      if(base64) files[item.id] = base64;
    }
    const blob = new Blob([JSON.stringify({ items, files }, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `계약서_백업_${isoDate(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }finally{
    if(btn){ btn.textContent = original; btn.disabled = false; }
  }
}

async function handleContractsImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const items = Array.isArray(data.items) ? data.items : [];
    const files = data.files || {};
    if(items.length === 0){ alert('가져올 계약서 데이터가 없습니다.'); return; }
    let added = 0, updatedFiles = 0;
    for(const item of items){
      if(!item || !item.id) continue;
      const existingIdx = contractsState.items.findIndex(it=>it.id===item.id);
      if(existingIdx>=0) contractsState.items[existingIdx] = item;
      else { contractsState.items.push(item); added++; }
      if(files[item.id]){
        const result = await saveContractFileData(item.id, files[item.id]);
        if(result.ok) updatedFiles++;
      }
    }
    await saveContractsIndex(contractsState.items);
    renderContractsMain();
    alert(`계약서 ${items.length}건을 가져왔습니다 (신규 ${added}건, 파일 복원 ${updatedFiles}건).`);
  }catch(err){
    console.error(err);
    alert('파일을 읽지 못했습니다. 올바른 계약서 백업(JSON) 파일인지 확인해주세요.');
  }
  e.target.value = '';
}

async function handleContractUpload(e){
  const files = [...(e.target.files||[])];
  if(files.length===0) return;
  contractsState.loading = true;
  renderContractsMain();
  // Storage keys are capped at 5MB, and base64-encoding a PDF inflates its
  // size by about a third — so the raw file must stay well under 5MB or
  // the encoded string itself will exceed the limit and silently fail to
  // save (the file would then vanish again after a reload).
  const MAX_BYTES = 3.5*1024*1024;
  const skipped = [];
  for(const file of files){
    if(file.size > MAX_BYTES){
      skipped.push(`${file.name} (5MB 저장 한도 초과)`);
      continue;
    }
    try{
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const id = rid();
      const saveResult = await saveContractFileData(id, base64);
      if(!saveResult.ok){
        skipped.push(`${file.name} (저장 실패: ${saveResult.reason})`);
        continue;
      }
      const item = { id, fileName: file.name, date: parseDateFromFilename(file.name), size: file.size, mime: file.type || 'application/pdf' };
      contractsState.items.push(item);
    }catch(err){
      console.error(err);
      skipped.push(file.name);
    }
  }
  await saveContractsIndex(contractsState.items);
  contractsState.loading = false;
  renderContractsMain();
  if(skipped.length){
    alert(`다음 파일은 저장하지 못했습니다 (PDF는 3.5MB 이하 권장):\n${skipped.join('\n')}`);
  }
}

let pdfLibLoadPromise = null;
function loadPdfLibLibrary(){
  if(pdfLibLoadPromise) return pdfLibLoadPromise;
  pdfLibLoadPromise = (async () => {
    if(!window.PDFLib){
      await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
    }
  })();
  return pdfLibLoadPromise;
}

let pdfJsLoadPromise = null;
const PDFJS_BASE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
// Some PDFs (especially ones from Korean government/business software) use
// non-embedded CJK fonts rather than embedding the glyphs directly. Without
// pointing pdf.js at the matching CMap + standard-font data, it silently
// fails to draw those characters — everything else on the page (lines,
// borders, embedded-font text) renders fine, but that text just vanishes.
// jsdelivr serves the pdfjs-dist npm package's own cmaps/ and
// standard_fonts/ folders directly, matching this exact pdf.js version.
const PDFJS_CMAP_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const PDFJS_STANDARD_FONTS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';
function pdfjsDocOptions(extra){
  return Object.assign({ cMapUrl: PDFJS_CMAP_URL, cMapPacked: true, standardFontDataUrl: PDFJS_STANDARD_FONTS_URL }, extra||{});
}
function loadPdfJsLibrary(){
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = (async () => {
    if(!window.pdfjsLib){
      await loadScript(PDFJS_BASE_URL + 'pdf.min.js');
    }
    // Some sandboxed/CSP'd environments block a worker script loading
    // directly from a cross-origin URL even when a plain <script> tag
    // from that same origin is allowed (worker-src can be stricter than
    // script-src). Fetching the worker code ourselves and handing pdf.js
    // a blob: URL for it sidesteps that, since blob: is same-origin.
    try{
      const workerCode = await fetch(PDFJS_BASE_URL + 'pdf.worker.min.js').then(r=>r.text());
      const blob = new Blob([workerCode], { type:'application/javascript' });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    }catch(e){
      // Fall back to the direct URL — pdf.js has its own fake-worker
      // fallback if this also doesn't work out.
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE_URL + 'pdf.worker.min.js';
    }
  })();
  return pdfJsLoadPromise;
}

// Renders every page of every given PDF (as raw bytes) into <canvas>
// elements inside the in-app preview overlay, so the person can actually
// see the contract(s) before printing — instead of relying on a new tab
// or embedded viewer, which can render blank in some browser/sandbox
// setups. `downloadName`/`downloadBlob` back the toolbar's 다운로드 link,
// and `label` is the small caption shown next to the toolbar buttons.
async function showPdfPreviewOverlay(byteArrays, { label, downloadName, downloadBlob } = {}){
  const overlay = document.getElementById('contractPreviewOverlay');
  const sheet = document.getElementById('contractPreviewSheet');
  const labelEl = document.getElementById('contractPreviewLabel');
  sheet.innerHTML = `<div class="pdf-preview-loading">미리보기를 준비하는 중…</div>`;
  labelEl.textContent = label || '';
  overlay.classList.add('show');

  const downloadLink = document.getElementById('contractPreviewDownloadBtn');
  if(downloadBlob){
    downloadLink.href = URL.createObjectURL(downloadBlob);
    downloadLink.setAttribute('download', downloadName || 'document.pdf');
    downloadLink.style.display = '';
  } else {
    downloadLink.style.display = 'none';
  }

  try{
    await withTimeout(loadPdfJsLibrary(), 15000);
    if(!window.pdfjsLib) throw new Error('pdf.js failed to load');
    sheet.innerHTML = '';
    for(const bytes of byteArrays){
      const pdf = await withTimeout(window.pdfjsLib.getDocument(pdfjsDocOptions({ data: bytes })).promise, 20000);
      if(!pdf) throw new Error('PDF loading timed out');
      for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
        const page = await pdf.getPage(pageNum);
        const baseViewport = page.getViewport({ scale:1 });
        const scale = Math.min(1500 / baseViewport.width, 2); // fit the overlay's ~1500px width, cap for very small pages
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const wrap = document.createElement('div');
        wrap.className = 'pdf-preview-page';
        wrap.appendChild(canvas);
        sheet.appendChild(wrap);
        await withTimeout(page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise, 15000);
      }
    }
    if(sheet.children.length===0){
      sheet.innerHTML = `<div class="pdf-preview-loading">표시할 페이지가 없습니다.</div>`;
    }
  }catch(err){
    console.error(err);
    sheet.innerHTML = `<div class="pdf-preview-loading">미리보기를 불러오지 못했습니다. 다운로드 버튼으로 파일을 받아 확인해주세요.</div>`;
  }
}
function closeContractPreview(){
  document.getElementById('contractPreviewOverlay').classList.remove('show');
  document.body.classList.remove('printing-contract-preview');
}
function printContractPreview(){
  document.body.classList.add('printing-contract-preview');
  window.print();
  // No reliable single cross-browser "print finished" event, so just drop
  // the print-only body class shortly after — the print dialog itself
  // already has the correct (isolated) content by the time it opens.
  setTimeout(()=> document.body.classList.remove('printing-contract-preview'), 1000);
}
document.getElementById('contractPreviewCloseBtn').addEventListener('click', closeContractPreview);
document.getElementById('contractPreviewPrintBtn').addEventListener('click', printContractPreview);

function base64ToBytes(base64){
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Merges every selected contract (in the order currently shown — i.e. by
// contract date) into a single combined PDF using pdf-lib, then opens it in
// a new tab so the person can print all of them together as one job,
// instead of each PDF's viewer printing separately.
async function printSelectedContracts(){
  const btn = document.getElementById('contractPrintSelectedBtn');
  const original = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '병합 중…'; btn.disabled = true; }
  try{
    await loadPdfLibLibrary();
    const orderedItems = sortedContracts().filter(it => contractsState.selected.has(it.id));
    if(orderedItems.length===0) return;

    const { PDFDocument } = window.PDFLib;
    const merged = await PDFDocument.create();
    for(const item of orderedItems){
      const base64 = await loadContractFileData(item.id);
      if(!base64) continue;
      const donorBytes = base64ToBytes(base64);
      const mime = item.mime || 'application/pdf';
      if(mime === 'application/pdf'){
        const donor = await PDFDocument.load(donorBytes, { ignoreEncryption:true });
        const pages = await merged.copyPages(donor, donor.getPageIndices());
        pages.forEach(p => merged.addPage(p));
      } else {
        // 사진으로 찍은 계약서(이미지)는 PDF가 아니므로, 이미지를 그대로
        // 한 페이지짜리 PDF 페이지로 변환해서 끼워 넣는다.
        const isPng = /png/.test(mime);
        const image = isPng ? await merged.embedPng(donorBytes) : await merged.embedJpg(donorBytes);
        const page = merged.addPage([image.width, image.height]);
        page.drawImage(image, { x:0, y:0, width:image.width, height:image.height });
      }
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type:'application/pdf' });
    showPdfPreviewOverlay([mergedBytes], {
      label: `선택한 계약서 ${orderedItems.length}건이 날짜순으로 합쳐졌습니다. 확인 후 인쇄 버튼을 눌러주세요.`,
      downloadName: `계약서_병합_${isoDate(new Date())}.pdf`,
      downloadBlob: blob,
    });
  }catch(err){
    console.error(err);
    alert('PDF를 합치는 중 오류가 발생했습니다. 손상되었거나 암호로 보호된 파일이 포함되어 있지 않은지 확인해주세요.');
  }finally{
    if(btn){ btn.textContent = original; btn.disabled = false; }
  }
}

// Renders page 1 of a PDF (given as raw bytes) to a canvas at a resolution
// generous enough for OCR, reusing the same pdf.js setup as the contract
// preview feature.
async function renderPdfFirstPageToCanvas(bytes){
  await loadPdfJsLibrary();
  const pdf = await withTimeout(window.pdfjsLib.getDocument(pdfjsDocOptions({ data: bytes })).promise, 20000);
  if(!pdf) throw new Error('PDF loading timed out');
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 3.5 }); // higher-res than the print preview, for sharper digits/characters going into OCR
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await withTimeout(page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise, 15000);
  return canvas;
}

// Loads an uploaded image into a canvas, upscaling small/low-res images so
// there's more pixel detail for OCR to work with (helps distinguish
// similar-looking digits like 1/2/4/5 in scanned forms).
function loadImageToCanvas(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const targetWidth = 2800; // upscale small photos/scans; downscale is skipped (canvas just uses natural size if already larger). Raised from 2200 for denser-text documents like 사업자등록증.
      const scale = img.naturalWidth < targetWidth ? targetWidth / img.naturalWidth : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Converts a canvas to black/white using Sauvola's local adaptive
// thresholding. A single global cutoff — even one chosen automatically from
// the histogram (Otsu) — still has to pick ONE brightness split for the
// whole image, which breaks down when lighting varies across the page
// (e.g. a shadow across half a phone photo): it either blows out the darker
// half's background to black or crushes the brighter half's text to white.
// Sauvola instead computes a threshold from each pixel's local neighborhood
// (via integral images, so it stays fast), which stays correct even when
// brightness varies smoothly across the page. Tested against a synthetic
// shadow-gradient image where Otsu mis-binarized the whole shadowed half to
// black; Sauvola kept the background white and only the text black.
function sauvolaBinarize(canvas, windowSize, k, R){
  windowSize = windowSize || 25; k = k || 0.34; R = R || 128;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const gray = new Float64Array(w*h);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }
  // Integral images of the grayscale values and their squares, so the local
  // mean/stddev in any window can be read in O(1) instead of re-summing the
  // window for every pixel.
  const integral = new Float64Array((w+1)*(h+1));
  const integralSq = new Float64Array((w+1)*(h+1));
  for(let y=0; y<h; y++){
    let rowSum=0, rowSumSq=0;
    for(let x=0; x<w; x++){
      const g = gray[y*w+x];
      rowSum += g; rowSumSq += g*g;
      const idx = (y+1)*(w+1)+(x+1);
      integral[idx] = integral[idx-(w+1)] + rowSum;
      integralSq[idx] = integralSq[idx-(w+1)] + rowSumSq;
    }
  }
  const half = Math.floor(windowSize/2);
  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      const x0=Math.max(0,x-half), x1=Math.min(w-1,x+half);
      const y0=Math.max(0,y-half), y1=Math.min(h-1,y+half);
      const area=(x1-x0+1)*(y1-y0+1);
      const A=y0*(w+1)+x0, B=y0*(w+1)+(x1+1), C=(y1+1)*(w+1)+x0, D=(y1+1)*(w+1)+(x1+1);
      const sum = integral[D]-integral[B]-integral[C]+integral[A];
      const sumSq = integralSq[D]-integralSq[B]-integralSq[C]+integralSq[A];
      const mean = sum/area;
      const varc = Math.max(0, sumSq/area - mean*mean);
      const stddev = Math.sqrt(varc);
      const threshold = mean * (1 + k*(stddev/R - 1));
      const p = y*w+x;
      const v = gray[p] > threshold ? 255 : 0;
      const idx = p*4;
      d[idx] = d[idx+1] = d[idx+2] = v;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}
// 이름은 기존 그대로 두고(다른 코드에서 이 이름으로 부르고 있음) 내부만 Sauvola로 교체.
function preprocessCanvasForOcr(canvas){
  return sauvolaBinarize(canvas);
}

// ---- 자동 기울기 보정(deskew) ----
// 휴대폰으로 찍은 문서 사진은 1~4도 정도 비뚤어진 경우가 매우 흔한데, 이걸
// 그대로 두면 인식률이 눈에 띄게 떨어진다. 작은 축소 사본에서 여러 각도를
// 빠르게 시도해보고, 텍스트 줄이 가장 또렷하게(가로 방향으로 정렬되게) 맞는
// 각도를 찾아 원본에 적용한다.
function rotateCanvasByDegrees(canvas, degrees){
  if(Math.abs(degrees) < 0.05) return canvas;
  const rad = degrees * Math.PI / 180;
  const w = canvas.width, h = canvas.height;
  const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  const newW = Math.round(w*cos + h*sin);
  const newH = Math.round(w*sin + h*cos);
  const out = document.createElement('canvas');
  out.width = newW; out.height = newH;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, newW, newH);
  ctx.translate(newW/2, newH/2);
  ctx.rotate(rad);
  ctx.drawImage(canvas, -w/2, -h/2);
  return out;
}
function downscaledCopyForSkew(canvas, maxWidth){
  const scale = canvas.width > maxWidth ? maxWidth/canvas.width : 1;
  const c = document.createElement('canvas');
  c.width = Math.round(canvas.width*scale);
  c.height = Math.round(canvas.height*scale);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}
function darkRowProfile(canvas){
  const ctx = canvas.getContext('2d');
  const { width:w, height:h } = canvas;
  const d = ctx.getImageData(0, 0, w, h).data;
  const rows = new Float64Array(h);
  for(let y=0; y<h; y++){
    let count = 0;
    const rowStart = y*w*4;
    for(let x=0; x<w; x++){
      if(d[rowStart + x*4] < 128) count++;
    }
    rows[y] = count;
  }
  return rows;
}
function rowProfileVariance(arr){
  let mean = 0;
  for(let i=0;i<arr.length;i++) mean += arr[i];
  mean /= arr.length;
  let v = 0;
  for(let i=0;i<arr.length;i++){ const diff = arr[i]-mean; v += diff*diff; }
  return v/arr.length;
}
function estimateSkewAngle(canvas){
  const work = downscaledCopyForSkew(canvas, 700);
  sauvolaBinarize(work);
  let bestAngle = 0, bestScore = -Infinity;
  for(let a=-5; a<=5; a+=0.5){
    const rotated = rotateCanvasByDegrees(work, a);
    const score = rowProfileVariance(darkRowProfile(rotated));
    if(score > bestScore){ bestScore = score; bestAngle = a; }
  }
  return bestAngle;
}

// Runs OCR on one 사용전점검 확인증 upload (PDF or image) and fills in the
// item's extracted 대표자 성명 / 점검년월일 fields. Always leaves the item
// in a usable state — on any failure it just marks the fields unrecognized
// so the person can type them in by hand instead.
async function runOcrForItem(item){
  item.ocrStatus = 'running';
  renderInspectionMain();
  try{
    const base64 = await loadInspectionFileData(item.id);
    if(!base64) throw new Error('file data missing');
    await loadTesseractLibrary();
    let canvas;
    if(item.mime === 'application/pdf'){
      canvas = await renderPdfFirstPageToCanvas(base64ToBytes(base64));
    } else {
      canvas = await loadImageToCanvas(`data:${item.mime};base64,${base64}`);
    }
    // 사진·스캔이 살짝 기울어져 있으면 인식률이 떨어지므로 먼저 바로잡는다.
    // 실패해도 원본 그대로 계속 진행(치명적 오류로 보지 않음).
    try{
      const angle = estimateSkewAngle(canvas);
      if(Math.abs(angle) >= 0.5) canvas = rotateCanvasByDegrees(canvas, angle);
    }catch(e){ console.warn('deskew skipped', e); }
    preprocessCanvasForOcr(canvas);
    const worker = await withTimeout(Tesseract.createWorker('kor'), 20000);
    if(!worker) throw new Error('OCR worker failed to start');
    try{
      // PSM 6 ("assume a single uniform block of text") tends to read
      // structured forms/certificates more reliably than the fully
      // automatic default layout analysis.
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      const result = await withTimeout(worker.recognize(canvas), 45000);
      if(!result) throw new Error('OCR timed out');
      const text = result.data.text || '';
      item.ocrText = text;
      item.extractedName = parseInspectionNameFromText(text, item.fileName);
      // 날짜는 별도로 한 번 더 인식한다: 일반 문자 인식은 숫자와 모양이
      // 비슷한 다른 문자(예: 2와 9)를 헷갈리기 쉬운데, 인식 대상을 숫자와
      // "년월일"로만 제한하면 훨씬 정확해진다.
      let dateText = text;
      try{
        await worker.setParameters({ tessedit_pageseg_mode: '6', tessedit_char_whitelist: '0123456789년월일 .-_' });
        const dateResult = await withTimeout(worker.recognize(canvas), 45000);
        if(dateResult && dateResult.data.text) dateText = dateResult.data.text;
      }catch(e){ /* 실패하면 그냥 기존 일반 인식 결과로 날짜를 찾는다 */ }
      item.extractedDate = parseInspectionDateFromText(dateText) || parseInspectionDateFromText(text);
      item.ocrStatus = (item.extractedName || item.extractedDate) ? 'done' : 'unrecognized';
    } finally {
      try{ await worker.terminate(); }catch(e){}
    }
  }catch(err){
    console.error(err);
    item.ocrStatus = 'error';
  }
  await saveInspectionIndex(inspectionState.items);
  await propagateInspectionDateToPerfList(item);
  renderInspectionMain();
}

// Re-runs OCR for every uploaded 사용전점검 확인증 one at a time (not in
// parallel, to keep the client-side OCR engine's CPU/memory use reasonable
// — mirrors how a fresh batch upload is processed).
async function reocrAllInspectionItems(){
  const btn = document.getElementById('inspectionReocrAllBtn');
  const items = [...inspectionState.items];
  for(let i=0; i<items.length; i++){
    if(btn) btn.textContent = `🔄 다시 인식 중… (${i+1}/${items.length})`;
    await runOcrForItem(items[i]);
  }
  if(btn) btn.textContent = '🔄 전체 다시 인식';
}

async function handleInspectionUpload(e){
  const files = [...(e.target.files||[])];
  if(files.length===0) return;
  const MAX_BYTES = 3.5*1024*1024; // see contracts upload for why (base64 inflates ~33%, storage cap is 5MB)
  const skipped = [];
  const newItems = [];
  for(const file of files){
    if(file.size > MAX_BYTES){
      skipped.push(`${file.name} (5MB 저장 한도 초과)`);
      continue;
    }
    if(file.type !== 'application/pdf' && !file.type.startsWith('image/')){
      skipped.push(`${file.name} (PDF 또는 이미지 파일만 지원)`);
      continue;
    }
    try{
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const id = rid();
      const saveResult = await saveInspectionFileData(id, base64);
      if(!saveResult.ok){ skipped.push(`${file.name} (저장 실패: ${saveResult.reason})`); continue; }
      const item = { id, fileName: file.name, size: file.size, mime: file.type, extractedName:'', extractedDate:'', ocrStatus:'pending' };
      inspectionState.items.push(item);
      newItems.push(item);
    }catch(err){
      console.error(err);
      skipped.push(file.name);
    }
  }
  await saveInspectionIndex(inspectionState.items);
  renderInspectionMain();
  if(skipped.length){
    alert(`다음 파일은 저장하지 못했습니다:\n${skipped.join('\n')}`);
  }
  // Run OCR one file at a time (not in parallel) to keep memory/CPU use
  // reasonable for a client-side WASM OCR engine.
  for(const item of newItems){
    await runOcrForItem(item);
  }
}

// Runs OCR on a 사업자등록증 upload and fills in the parsed business-info
// fields. Mirrors runOcrForItem's structure (PDF vs image handling, timeout
// safety) — always leaves the item usable even if OCR fails, since every
// field stays manually editable regardless.
async function runBizRegOcrForItem(item){
  item.ocrStatus = 'running';
  renderAgentDocsMain();
  try{
    const base64 = await loadAgentDocFileData(item.id);
    if(!base64) throw new Error('file data missing');
    await loadTesseractLibrary();
    let canvas;
    if(item.mime === 'application/pdf'){
      canvas = await renderPdfFirstPageToCanvas(base64ToBytes(base64));
    } else {
      canvas = await loadImageToCanvas(`data:${item.mime};base64,${base64}`);
    }
    try{
      const angle = estimateSkewAngle(canvas);
      if(Math.abs(angle) >= 0.5) canvas = rotateCanvasByDegrees(canvas, angle);
    }catch(e){ console.warn('deskew skipped', e); }
    preprocessCanvasForOcr(canvas);
    const worker = await withTimeout(Tesseract.createWorker('kor'), 20000);
    if(!worker) throw new Error('OCR worker failed to start');
    try{
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      const result = await withTimeout(worker.recognize(canvas), 45000);
      if(!result) throw new Error('OCR timed out');
      const text = result.data.text || '';
      item.ocrText = text;
      // 사업자등록번호는 별도로 한 번 더 인식한다: 일반 문자 인식은 숫자를
      // 주변 한글/기호와 헷갈리기 쉬운데, 인식 대상을 숫자와 대시로만
      // 제한하면 훨씬 정확해진다 (사용전점검 날짜 인식과 같은 방식).
      let digitText = '';
      try{
        await worker.setParameters({ tessedit_pageseg_mode: '6', tessedit_char_whitelist: '0123456789-' });
        const digitResult = await withTimeout(worker.recognize(canvas), 45000);
        if(digitResult && digitResult.data.text) digitText = digitResult.data.text;
      }catch(e){ /* 실패하면 그냥 기존 일반 인식 결과로 번호를 찾는다 */ }
      const parsed = parseBizRegFromText(text);
      const digitBizNumber = parseBizNumber(digitText);
      if(digitBizNumber) parsed.bizNumber = digitBizNumber; // 숫자 전용 패스에서 찾았다면 그걸 우선 사용
      item.isCorporate = parsed.isCorporate;
      item.bizName = parsed.bizName;
      item.ownerName = parsed.ownerName;
      item.bizNumber = parsed.bizNumber;
      item.bizType = parsed.bizType;
      item.bizItem = parsed.bizItem;
      item.email = parsed.email;
      item.ocrStatus = 'done';
    } finally {
      try{ await worker.terminate(); }catch(e){}
    }
  }catch(err){
    console.error(err);
    item.ocrStatus = 'error';
  }
  await saveAgentDocsIndex(agentDocsState.items);
  renderAgentDocsMain();
}

async function handleAgentDocUpload(e){
  const files = [...(e.target.files||[])];
  if(files.length===0) return;
  const customerInput = document.getElementById('agentDocCustomerInput');
  const customerName = customerInput ? customerInput.value.trim() : '';
  if(!customerName){
    const hint = document.getElementById('agentDocUploadHint');
    if(hint) hint.style.display = '';
    e.target.value = '';
    return;
  }
  agentDocsState.pendingCustomer = customerName; // remember for the next upload in this session
  const category = agentDocsState.category;
  const MAX_BYTES = 3.5*1024*1024; // see contracts upload for why (base64 inflates ~33%, storage cap is 5MB)
  const skipped = [];
  const newBizregItems = [];
  for(const file of files){
    if(file.size > MAX_BYTES){ skipped.push(`${file.name} (5MB 저장 한도 초과)`); continue; }
    if(file.type !== 'application/pdf' && !file.type.startsWith('image/')){
      skipped.push(`${file.name} (PDF 또는 이미지 파일만 지원)`); continue;
    }
    try{
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const id = rid();
      const saveResult = await saveAgentDocFileData(id, base64);
      if(!saveResult.ok){ skipped.push(`${file.name} (저장 실패: ${saveResult.reason})`); continue; }
      const item = { id, category, customerName, fileName: file.name, size: file.size, mime: file.type, uploadedAt: isoDate(new Date()) };
      if(category === 'bizreg'){
        Object.assign(item, { isCorporate:null, bizName:'', ownerName:'', bizNumber:'', bizType:'', bizItem:'', email:'', ocrStatus:'pending' });
      }
      agentDocsState.items.push(item);
      if(category === 'bizreg') newBizregItems.push(item);
    }catch(err){
      console.error(err);
      skipped.push(file.name);
    }
  }
  await saveAgentDocsIndex(agentDocsState.items);
  renderAgentDocsMain();
  if(skipped.length){
    alert(`다음 파일은 저장하지 못했습니다:\n${skipped.join('\n')}`);
  }
  for(const item of newBizregItems){
    await runBizRegOcrForItem(item);
  }
}

                  <button class="agentdoc-download-btn" data-id="${item.id}" style="font-size:11px; padding:5px 9px; border-radius:5px; border:1px solid var(--pos); background:transparent; color:var(--pos); cursor:pointer;">다운로드</button>
                  <button class="agentdoc-del-btn" data-id="${item.id}" style="font-size:11px; padding:5px 9px; border-radius:5px; border:1px solid var(--line); background:transparent; color:var(--neg); cursor:pointer;">삭제</button>

  });

  main.querySelectorAll('.agentdoc-field').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===el.dataset.id);
      if(!item) return;
      const field = el.dataset.field;
      item[field] = field==='isCorporate' ? (el.value===''?null:el.value==='true') : el.value.trim();
      await saveAgentDocsIndex(agentDocsState.items);
    });
  });
  main.querySelectorAll('.agentdoc-reocr-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(item) runBizRegOcrForItem(item);
    });
  });
  main.querySelectorAll('.agentdoc-view-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const original = btn.textContent;
      btn.textContent = '여는 중…';
      const base64 = await loadAgentDocFileData(item.id);
      btn.textContent = original;
      if(!base64){ alert('파일을 불러오지 못했습니다.' + (lastStorageLoadError ? `\n\n(원인: ${lastStorageLoadError})` : '')); return; }
      const blob = new Blob([base64ToBytes(base64)], { type:item.mime });
      if(item.mime === 'application/pdf'){
        showPdfPreviewOverlay([base64ToBytes(base64)], { label: item.fileName, downloadName: item.fileName, downloadBlob: blob });
      } else {
        showImagePreviewOverlay(`data:${item.mime};base64,${base64}`, { label: item.fileName, downloadName: item.fileName, downloadBlob: blob });
      }
    });
  });
  main.querySelectorAll('.agentdoc-download-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const original = btn.textContent;
      btn.textContent = '받는 중…';
      const base64 = await loadAgentDocFileData(item.id);
      btn.textContent = original;
      if(!base64){ alert('파일을 불러오지 못했습니다.' + (lastStorageLoadError ? `\n\n(원인: ${lastStorageLoadError})` : '')); return; }
      downloadBase64File(base64, item.mime, item.fileName);
    });
  });
  main.querySelectorAll('.agentdoc-subcheck').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===cb.dataset.id);
      if(!item) return;
      item[cb.dataset.sub+'Checked'] = cb.checked;
      await saveAgentDocsIndex(agentDocsState.items);
      renderAgentDocsMain();
    });
  });
  main.querySelectorAll('.agentdoc-subfile-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const item = agentDocsState.items.find(it=>it.id===inp.dataset.id);
      if(!item) return;
      const sub = inp.dataset.sub;
      if(file.size > 3.5*1024*1024){ alert('파일 용량이 너무 큽니다 (3.5MB 이하로 올려주세요).'); e.target.value=''; return; }
      try{
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const saveResult = await saveAgentDocSubFileData(item.id, sub, base64);
        if(!saveResult.ok){ alert(`저장 실패: ${saveResult.reason}`); return; }
        item[sub+'File'] = { fileName: file.name, size: file.size, mime: file.type };
        await saveAgentDocsIndex(agentDocsState.items);
        renderAgentDocsMain();
      }catch(err){
        console.error(err);
        alert('파일을 저장하지 못했습니다.');
      }
    });
  });
  main.querySelectorAll('.agentdoc-subfile-view').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const sub = btn.dataset.sub;
      const file = item[sub+'File'];
      if(!file) return;
      const original = btn.textContent;
      btn.textContent = '여는 중…';
      const base64 = await loadAgentDocSubFileData(item.id, sub);
      btn.textContent = original;
      if(!base64){ alert('파일을 불러오지 못했습니다.' + (lastStorageLoadError ? `\n\n(원인: ${lastStorageLoadError})` : '')); return; }
      const blob = new Blob([base64ToBytes(base64)], { type:file.mime });
      if(file.mime === 'application/pdf'){
        showPdfPreviewOverlay([base64ToBytes(base64)], { label: file.fileName, downloadName: file.fileName, downloadBlob: blob });
      } else {
        showImagePreviewOverlay(`data:${file.mime};base64,${base64}`, { label: file.fileName, downloadName: file.fileName, downloadBlob: blob });
      }
    });
  });
  main.querySelectorAll('.agentdoc-subfile-download').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const sub = btn.dataset.sub;
      const file = item[sub+'File'];
      if(!file) return;
      const original = btn.textContent;
      btn.textContent = '받는 중…';
      const base64 = await loadAgentDocSubFileData(item.id, sub);
      btn.textContent = original;
      if(!base64){ alert('파일을 불러오지 못했습니다.' + (lastStorageLoadError ? `\n\n(원인: ${lastStorageLoadError})` : '')); return; }
      downloadBase64File(base64, file.mime, file.fileName);
    });
  });
  main.querySelectorAll('.agentdoc-subfile-remove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('첨부한 파일을 삭제할까요?')) return;
      const item = agentDocsState.items.find(it=>it.id===btn.dataset.id);
      if(!item) return;
      const sub = btn.dataset.sub;
      delete item[sub+'File'];
      await deleteAgentDocSubFileData(item.id, sub);
      await saveAgentDocsIndex(agentDocsState.items);
      renderAgentDocsMain();
    });
  });
  main.querySelectorAll('.agentdoc-del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('이 서류를 삭제할까요? 되돌릴 수 없습니다.')) return;
      const id = btn.dataset.id;
      agentDocsState.items = agentDocsState.items.filter(it=>it.id!==id);
      await saveAgentDocsIndex(agentDocsState.items);
      await deleteAgentDocFileData(id);
      renderAgentDocsMain();
    });
  });
}

function newModuleMasterRow(){
  return {
    id: rid(), modelCode:'', displayName:'', watt:500, grade:'',
    materialBuyPerWatt:0, materialSellPerWatt:0, depositSlab:0, depositAttached:null,
    noteOrder:'slab-first'
  };
}
function moduleMasterFieldHtml(m, field, label, width){
  const isMoney = ['materialBuyPerWatt','materialSellPerWatt','depositSlab'].includes(field);
  const isOverride = field === 'depositAttached';
  let val = m[field];
  if(isMoney) val = val ? Number(val).toLocaleString('ko-KR') : '';
  else if(isOverride) val = (val===null||val===undefined) ? '' : Number(val).toLocaleString('ko-KR');
  else val = val ?? '';
  const placeholder = isOverride ? `자동: ${Number(moduleDepositAttached(m)).toLocaleString('ko-KR')}` : '';
  return `<td style="padding:6px;"><input data-mm="${field}" data-id="${m.id}" value="${escapeHtml(String(val))}" placeholder="${escapeHtml(placeholder)}"
    style="width:${width||90}px; padding:6px 7px; border-radius:5px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:12.5px; text-align:${field==='displayName'||field==='modelCode'||field==='grade'?'left':'right'};"></td>`;
}
function renderModulePricesMain(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <h2 class="section-title">모듈 단가 관리</h2>
    <p style="font-size:12.5px; color:var(--muted); line-height:1.7; margin:0 0 16px;">
      여기서 관리하는 단가가 영업비 정산의 "입금가 설명" 문구, 실적리스트 가져오기의 계약금액 자동계산,
      사업 이윤정산의 자재비 구매·판매 단가에 공통으로 쓰입니다. 단가를 수정해도 <b>이미 저장된 정산 건의 숫자는 바뀌지 않으며</b>,
      새로 만드는 건이나 "다시 계산" 버튼을 눌렀을 때만 반영됩니다.
      부착형 입금가는 비워두면 슬라브형 - 10만원이 자동 적용됩니다.
    </p>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <button id="mmAddBtn" style="padding:9px 14px; border-radius:7px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:12.5px; cursor:pointer;">+ 모듈 추가</button>
    </div>
    <div class="table-wrap" id="mmTableWrap">
      <table style="border-collapse:collapse; min-width:1200px;">
        <thead>
          <tr>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">표시명</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">등급</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">W</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">실적리스트 모델코드</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">자재 구매단가(원/W)</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">자재 판매단가(원/W)</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">슬라브형 입금가(원)</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">부착형 입금가(원, 비우면 자동)</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">자재구매/판매 금액</th>
            <th style="padding:7px 6px; font-size:10.5px; color:var(--muted);">삭제</th>
          </tr>
        </thead>
        <tbody>
          ${moduleMaster.map(m=>{
            const buyAmt = Math.round((Number(m.materialBuyPerWatt)||0)*(Number(m.watt)||0));
            const sellAmt = Math.round((Number(m.materialSellPerWatt)||0)*(Number(m.watt)||0));
            return `<tr data-row-id="${m.id}">
              ${moduleMasterFieldHtml(m,'displayName','표시명',80)}
              ${moduleMasterFieldHtml(m,'grade','등급',60)}
              ${moduleMasterFieldHtml(m,'watt','W',55)}
              ${moduleMasterFieldHtml(m,'modelCode','모델코드',180)}
              ${moduleMasterFieldHtml(m,'materialBuyPerWatt','자재구매단가',90)}
              ${moduleMasterFieldHtml(m,'materialSellPerWatt','자재판매단가',90)}
              ${moduleMasterFieldHtml(m,'depositSlab','슬라브형입금가',100)}
              ${moduleMasterFieldHtml(m,'depositAttached','부착형입금가',100)}
              <td style="padding:6px; font-size:11.5px; color:var(--muted); white-space:nowrap;">${fmtWon(buyAmt)} / ${fmtWon(sellAmt)}</td>
              <td style="padding:6px; text-align:center;"><button class="mm-delete-btn" data-id="${m.id}" style="font-size:11px; padding:5px 9px; border-radius:5px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">삭제</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('mmAddBtn').addEventListener('click', ()=>{
    moduleMaster.push(newModuleMasterRow());
    rebuildModuleDerived();
    debouncedSaveModuleMaster();
    renderModulePricesMain();
  });
  main.querySelectorAll('.mm-delete-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('이 모듈을 삭제할까요?\n주의: 이미 저장된 영업비 정산 건 중 이 모듈보다 뒤에 추가된 모듈을 쓰는 건이 있다면, 체크박스 표시가 어긋날 수 있습니다.')) return;
      moduleMaster = moduleMaster.filter(x=>x.id!==btn.dataset.id);
      rebuildModuleDerived();
      debouncedSaveModuleMaster();
      renderModulePricesMain();
    });
  });
  main.querySelectorAll('[data-mm]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const m = moduleMaster.find(x=>x.id===inp.dataset.id);
      if(!m) return;
      const field = inp.dataset.mm;
      if(field === 'displayName' || field === 'grade' || field === 'modelCode'){
        m[field] = inp.value;
      }else if(field === 'depositAttached'){
        const raw = String(inp.value).replace(/,/g,'').trim();
        m[field] = raw === '' ? null : (parseFloat(raw)||0);
      }else{
        m[field] = parseFloat(String(inp.value).replace(/,/g,'')) || 0;
      }
      rebuildModuleDerived();
      debouncedSaveModuleMaster();
      renderModulePricesMain();
    });
  });
}

// ---------- 변경 이력 (모든 정산 건을 한 곳에서) ----------
// 건 각각의 상세 화면에 있던 "🕒 변경 이력" 버튼과 완전히 같은 오버레이

// 바로 이력을 확인·복원할 수 있도록 전체 목록만 모아서 보여준다.

  const main = document.getElementById('main');
  main.innerHTML = `<div class="no-case"><div class="big">불러오는 중…</div></div>`;

  if(state.activeTab !== 'history') return; // 불러오는 동안 다른 탭으로 이동했으면 무시
  state.cases = list;

  const sorted = [...list].sort((a,b)=>b.updated-a.updated);

  main.innerHTML = `
    <h2 class="section-title">변경 이력</h2>
    <p style="font-size:12.5px; color:var(--muted); line-height:1.7; margin:0 0 16px;">

      건을 수정할 때마다(최소 1분 간격으로) 자동으로 기록되며, 각 건당 최근 20개 버전까지 보관됩니다.
    </p>
    ${sorted.length===0 ? `<div class="empty-side">아직 저장된 정산 건이 없습니다.</div>` : `
    <div class="table-wrap">
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr>
          <th style="padding:8px 6px; font-size:11px; color:var(--muted); text-align:left; width:90px;">종류</th>
          <th style="padding:8px 6px; font-size:11px; color:var(--muted); text-align:left;">건 제목 / 고객명</th>
          <th style="padding:8px 6px; font-size:11px; color:var(--muted); width:150px;">마지막 수정</th>
          <th style="padding:8px 6px; font-size:11px; color:var(--muted); width:140px;">작업</th>
        </tr></thead>
        <tbody>
          ${sorted.map(c => `
            <tr data-id="${c.id}">

// ---------- 카드 대사·자동갱신 (법인카드 관리대장 ↔ 승인내역 ↔ 통합본) ----------
// MVP: 카드 1개씩 처리. 통합본(3번 파일)은 대상 카드 블록의 B~Q열만 "값"으로
// 덮어쓰고, 그 외 시트·다른 카드 블록·외부링크·서식은 절대 건드리지 않는다 —
// 이를 위해 openpyxl/SheetJS로 통째로 열었다 다시 쓰는 대신, ZIP(xlsx) 내부의
// 해당 시트 XML 한 파일만 문자열 수준에서 직접 수정한다 (SheetJS로 통합본 전체를
// 다시 저장하면 외부링크가 깨진다는 게 확인된 사실이라 이 방식을 쓴다).
function ledgerParseAoa(aoa){
  const headerIdx = aoa.findIndex(row => row && String(row[1]||'').replace(/\s/g,'')==='날짜' && String(row[3]||'').replace(/\s/g,'')==='성명');
  if(headerIdx < 0) return { error: '관리대장 시트에서 헤더 행(날짜/성명 등)을 찾지 못했습니다. 시트를 다시 확인해주세요.' };
  const dataRows = [];
  for(let i=headerIdx+1;i<aoa.length;i++){
    const row = aoa[i] || [];
    const dateVal = row[1], nameVal = row[3];
    const dateEmpty = dateVal===undefined || dateVal===null || dateVal==='';
    const nameEmpty = nameVal===undefined || nameVal===null || nameVal==='';
    if(dateEmpty && nameEmpty) break; // 데이터 끝
    if(dateEmpty) continue; // 빈 줄은 건너뜀
    dataRows.push(row);
  }
  if(dataRows.length===0) return { error: '관리대장 시트에서 실제 사용 내역을 찾지 못했습니다.' };
  return { dataRows };
}
function ledgerRowToEntry(row){
  const dateVal = row[1];
  const dateObj = (dateVal instanceof Date) ? dateVal : null;
  // SheetJS의 cellDates 옵션은 엑셀 날짜(시간대 없는 달력 날짜)를 Date.UTC 기준으로
  // 만든다. 여기서 로컬시간 getter(getDate 등)를 쓰면 브라우저가 UTC보다 느린
  // 시간대일 때 하루가 앞으로 당겨진다 — 반드시 UTC getter로 읽어야 한다.
  const dayNum = dateObj ? dateObj.getUTCDate() : (parseInt(String(dateVal).trim().split(/[-.\/]/).pop(),10) || '');
  const isoD = dateObj ? isoDateUTC(dateObj) : normalizeDotDate(dateVal);
  const amount = Math.round(Number(row[13])||0);
  // 통합본 B~Q열에 그대로 옮겨쓸 16개 값 (B=날짜(일자만), C~Q=원본 그대로)
  const block = [dayNum, ...row.slice(2,17)];
  return { isoDate: isoD, amount, block, display: { date:isoD, name:row[3], place:row[8], work:row[9], item:row[10], amount } };
}
function isoDateUTC(d){
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function normalizeDotDate(s){
  const m = String(s||'').trim().match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(!m) return String(s||'');
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function findCardNumberInAoa(aoa){
  for(const row of aoa){
    for(const cell of (row||[])){
      const s = String(cell||'');
      const m = s.match(/\d{4}-\d{4}-\d{4}-\d{4}/);
      if(m) return m[0];
    }
  }
  return '';
}
function cardParts(full){
  const m = String(full||'').trim().match(/^(\d{4})-(\d{4})-(\d{4})-(\d{4})$/);
  if(!m) return null;
  return { p1:m[1], p2:m[2], p3:m[3], p4:m[4] };
}
function approvalRowMatchesCard(cardNoStr, parts){
  const m = String(cardNoStr||'').trim().match(/^(\d{4})-(\d{4})-(\S{4})-(\d{4})$/);
  if(!m) return false;
  return m[1]===parts.p1 && m[4]===parts.p4;
}
function reconcileCardEntries(ledgerEntries, approvalEntries){
  const used = new Array(approvalEntries.length).fill(false);
  const rows = ledgerEntries.map(le=>{
    const idx = approvalEntries.findIndex((ae,i)=> !used[i] && ae.isoDate===le.isoDate && ae.amount===le.amount);
    if(idx>=0){ used[idx]=true; return { ...le, status:'match' }; }
    return { ...le, status:'ledger_only' };
  });
  const extra = approvalEntries.filter((ae,i)=>!used[i]).map(ae=>({ ...ae, status:'approval_only' }));
  return { rows, extra };
}
const CARD_BLOCK_COLS = ['B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];
const CARD_NUMERIC_COLS = new Set(['B','L','M','N']);
function colIndexLetter(letter){ return letter.charCodeAt(0); } // 단일 알파벳 열만 다루므로 충분
async function patchFile3CardBlock(masterArrayBuffer, sheetLabel, cardLast4, entryBlocks){
  await loadJSZipLib();
  const zip = await window.JSZip.loadAsync(masterArrayBuffer);
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const SS_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

  const wbFile = zip.file('xl/workbook.xml');
  if(!wbFile) return { error: '통합본 파일 구조를 인식할 수 없습니다(workbook.xml 없음).' };
  const wbXmlText = await wbFile.async('string');
  const wbDoc = parser.parseFromString(wbXmlText, 'application/xml');
  const sheetEl = Array.from(wbDoc.getElementsByTagName('sheet')).find(el => el.getAttribute('name') === sheetLabel);
  if(!sheetEl) return { error: `통합본에서 "${sheetLabel}" 시트를 찾을 수 없습니다.` };
  const rId = sheetEl.getAttributeNS(REL_NS, 'id');

  const relsFile = zip.file('xl/_rels/workbook.xml.rels');
  if(!relsFile) return { error: '통합본 워크북 관계 정보를 찾을 수 없습니다.' };
  const relsText = await relsFile.async('string');
  const relsDoc = parser.parseFromString(relsText, 'application/xml');
  const relEl = Array.from(relsDoc.getElementsByTagName('Relationship')).find(el => el.getAttribute('Id') === rId);
  if(!relEl) return { error: '시트 경로 정보를 찾을 수 없습니다.' };
  let target = relEl.getAttribute('Target') || '';
  target = target.replace(/^\.?\//,'');
  const sheetPath = target.startsWith('xl/') ? target : ('xl/' + target);
  const sheetFile = zip.file(sheetPath);
  if(!sheetFile) return { error: `시트 파일(${sheetPath})을 찾을 수 없습니다.` };

  let sharedStrings = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if(ssFile){
    const ssText = await ssFile.async('string');
    const ssDoc = parser.parseFromString(ssText, 'application/xml');
    sharedStrings = Array.from(ssDoc.getElementsByTagName('si')).map(si =>
      Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')
    );
  }

  const sheetXmlText = await sheetFile.async('string');
  const sheetDoc = parser.parseFromString(sheetXmlText, 'application/xml');
  const sheetDataEl = sheetDoc.getElementsByTagName('sheetData')[0];
  if(!sheetDataEl) return { error: '시트 데이터 영역을 찾을 수 없습니다.' };
  const rowEls = Array.from(sheetDataEl.getElementsByTagName('row'));

  function findCell(rowEl, colLetter){
    const rowNum = rowEl.getAttribute('r');
    return Array.from(rowEl.getElementsByTagName('c')).find(el => el.getAttribute('r') === colLetter+rowNum) || null;
  }
  function cellText(rowEl, colLetter){
    const c = findCell(rowEl, colLetter);
    if(!c) return '';
    const t = c.getAttribute('t');
    if(t === 's'){
      const vEl = c.getElementsByTagName('v')[0];
      const idx = vEl ? parseInt(vEl.textContent,10) : -1;
      return sharedStrings[idx] || '';
    }
    if(t === 'inlineStr'){
      const isEl = c.getElementsByTagName('is')[0];
      return isEl ? Array.from(isEl.getElementsByTagName('t')).map(t=>t.textContent).join('') : '';
    }
    const vEl = c.getElementsByTagName('v')[0];
    return vEl ? vEl.textContent : '';
  }

  // 헤더 행(1행) 안전 점검 — 열 배치가 예상과 다르면 잘못된 칸에 쓰지 않도록 중단.
  const headerRow = rowEls.find(r => r.getAttribute('r') === '1');
  if(headerRow){
    const expected = { B:'날짜', C:'부서', D:'성명', R:'카드번호합계용' };
    for(const [col,label] of Object.entries(expected)){
      const txt = cellText(headerRow, col).replace(/\s/g,'');
      if(txt && txt !== label){
        return { error: `"${sheetLabel}" 시트의 열 구성이 예상과 달라 안전하게 처리할 수 없습니다 (${col}열이 "${label}"가 아니라 "${txt}"). 수동 확인이 필요합니다.` };
      }
    }
  }

  const blockRows = rowEls.filter(r => cellText(r,'R').trim() === String(cardLast4).trim());
  if(blockRows.length === 0){
    return { error: `"${sheetLabel}" 시트에서 카드 ${cardLast4} 블록을 찾지 못했습니다.` };
  }
  if(entryBlocks.length > blockRows.length){
    return { error:'overflow', blockSize: blockRows.length, needed: entryBlocks.length };
  }

  for(let i=0;i<entryBlocks.length;i++){
    const rowEl = blockRows[i];
    const rowNum = rowEl.getAttribute('r');
    const values = entryBlocks[i];
    CARD_BLOCK_COLS.forEach((col, ci) => {
      let raw = values[ci];
      if(raw===undefined || raw===null) raw = '';
      let cEl = findCell(rowEl, col);
      if(!cEl){
        cEl = sheetDoc.createElementNS(SS_NS,'c');
        cEl.setAttribute('r', col+rowNum);
        const existing = Array.from(rowEl.getElementsByTagName('c'));
        const before = existing.find(el => colIndexLetter(el.getAttribute('r').replace(/\d+$/,'')) > colIndexLetter(col));
        if(before) rowEl.insertBefore(cEl, before); else rowEl.appendChild(cEl);
      }
      while(cEl.firstChild) cEl.removeChild(cEl.firstChild);
      if(CARD_NUMERIC_COLS.has(col)){
        cEl.removeAttribute('t');
        const num = parseFloat(String(raw).replace(/,/g,'')) || 0;
        const vEl = sheetDoc.createElementNS(SS_NS,'v');
        vEl.textContent = String(num);
        cEl.appendChild(vEl);
      }else{
        cEl.setAttribute('t','inlineStr');
        const isEl = sheetDoc.createElementNS(SS_NS,'is');
        const tEl = sheetDoc.createElementNS(SS_NS,'t');
        tEl.textContent = String(raw);
        isEl.appendChild(tEl);
        cEl.appendChild(isEl);
      }
    });
  }

  zip.file(sheetPath, serializer.serializeToString(sheetDoc));

  // 열어볼 때 SUMIF 등 수식이 자동으로 다시 계산되도록 강제.
  let calcPr = wbDoc.getElementsByTagName('calcPr')[0];
  if(!calcPr){
    calcPr = wbDoc.createElementNS(SS_NS, 'calcPr');
    wbDoc.documentElement.appendChild(calcPr);
  }
  calcPr.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/workbook.xml', serializer.serializeToString(wbDoc));

  const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{level:6} });
  return { blob };
}

async function readWorkbookFromFile(file){
  await loadXlsxLib();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  return { wb, buf };
}
