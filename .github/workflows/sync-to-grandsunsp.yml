name: Sync app to grandsunsp-groupware

# 경기지사 업무프로그램(index.html 등)이 바뀔 때마다 gseng92279-lab/grandsunsp-groupware
# 저장소의 gyeonggi-app/ 폴더에 그대로 복사해서 커밋한다. 반대 방향(grandsunsp-groupware
# 쪽 sync-to-didrhkdehfdl.yml)과 짝을 이뤄 양방향 동기화를 구성한다.
#
# 동기화 커밋이 서로를 계속 되튀기며 트리거하는 걸 막기 위해, 커밋 메시지에
# "[sync]"가 있으면(=이 워크플로 자신이 만든 커밋이면) 다시 실행하지 않는다.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'firebase-messaging-sw.js'
      - 'firebase.json'
      - 'functions/**'

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[sync]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Push files to grandsunsp-groupware
        env:
          TARGET_TOKEN: ${{ secrets.GRANDSUNSP_SYNC_TOKEN }}
        run: |
          set -e
          if [ -z "$TARGET_TOKEN" ]; then
            echo "GRANDSUNSP_SYNC_TOKEN secret이 설정되어 있지 않습니다. 저장소 Settings > Secrets and variables > Actions에서 등록해주세요." >&2
            exit 1
          fi
          git config --global user.name "gyeonggi-app-sync-bot"
          git config --global user.email "gyeonggi-app-sync-bot@users.noreply.github.com"

          rm -rf /tmp/target
          git clone "https://x-access-token:${TARGET_TOKEN}@github.com/gseng92279-lab/grandsunsp-groupware.git" /tmp/target

          mkdir -p /tmp/target/gyeonggi-app
          cp index.html /tmp/target/gyeonggi-app/index.html
          [ -f firebase-messaging-sw.js ] && cp firebase-messaging-sw.js /tmp/target/gyeonggi-app/firebase-messaging-sw.js || true
          [ -f firebase.json ] && cp firebase.json /tmp/target/gyeonggi-app/firebase.json || true
          rm -rf /tmp/target/gyeonggi-app/functions
          if [ -d functions ]; then
            mkdir -p /tmp/target/gyeonggi-app/functions
            cp -r functions/. /tmp/target/gyeonggi-app/functions/
          fi

          cd /tmp/target
          git add gyeonggi-app
          if git diff --cached --quiet; then
            echo "동기화할 변경 사항이 없습니다."
          else
            git commit -m "[sync] 경기지사 업무프로그램 업데이트 (from didrhkdehfdl/-@${{ github.sha }})"
            git push origin HEAD:main
          fi
